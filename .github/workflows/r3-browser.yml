name: r3 website browser

on:
  pull_request:
    paths:
      - 'apps/r3-web/**'
      - 'packages/**'
      - 'package*.json'
      - 'playwright.r3.config.ts'
      - 'tests/browser/r3-web.spec.ts'
      - '.github/workflows/r3-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run check -w @n3wth/r3-web
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.r3.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-browser-evidence
          path: test-results
          retention-days: 7
