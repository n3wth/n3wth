name: Cloudflare production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-main
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  NPM_VERSION: 11.19.1

jobs:
  validate:
    name: validate / affected apps
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Select affected production apps
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            apps="$(node scripts/deploy-apps.mjs --slugs)"
            echo "apps=$apps" >> "$GITHUB_OUTPUT"
            echo "Selected production apps: $apps"
          else
            node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          import { DEPLOY_APP_SLUGS, deployAppForWorkspace } from './scripts/deploy-apps.mjs'

          const base = process.env.BEFORE_SHA
          const workspaces = JSON.parse(execFileSync(process.execPath, ['scripts/affected.mjs', '--base', base, '--list', '--deployment'], { encoding: 'utf8' }))
          const files = execFileSync('git', ['diff', '--name-only', `${base}..HEAD`, '--'], { encoding: 'utf8' }).split('\n').filter(Boolean)
          const infrastructure = files.some(file => [
            '.github/workflows/cloudflare-production.yml',
            'package-lock.json',
            'scripts/affected.mjs',
            'scripts/build.mjs',
            'scripts/deploy-apps.mjs',
          ].includes(file) || /^apps\/[^/]+\/(?:wrangler\.jsonc|worker\/wrangler\.jsonc)$/.test(file))
          const apps = infrastructure
            ? DEPLOY_APP_SLUGS
            : workspaces.map(deployAppForWorkspace).filter(Boolean)
          appendFileSync(process.env.GITHUB_OUTPUT, `apps=${apps.join(' ')}\n`)
          console.log(`Selected production apps: ${apps.join(' ') || 'none'}`)
          JS
          fi
      - name: Verify deployment SHA
        if: steps.affected.outputs.apps != ''
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Install npm
        if: steps.affected.outputs.apps != ''
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - name: Install dependencies
        if: steps.affected.outputs.apps != ''
        run: npm ci
      - name: Run affected workspace checks
        if: steps.affected.outputs.apps != ''
        env:
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && '0000000000000000000000000000000000000000' || github.event.before }}
        run: node scripts/affected.mjs --base "$BASE_SHA"
      - name: Build affected Cloudflare apps
        if: steps.affected.outputs.apps != ''
        env:
          APPS: ${{ steps.affected.outputs.apps }}
        shell: bash
        run: |
          targets=()
          for app in $APPS; do
            targets+=(--workspace "@n3wth/$app")
          done
          npm run build:cloudflare -- "${targets[@]}"

  deploy:
    name: deploy / production
    needs: validate
    if: needs.validate.outputs.apps != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Verify deployment SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Install npm
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Build deployment artifacts
        env:
          APPS: ${{ needs.validate.outputs.apps }}
        shell: bash
        run: |
          targets=()
          for app in $APPS; do
            targets+=(--workspace "@n3wth/$app")
          done
          npm run build:cloudflare -- "${targets[@]}"
      - name: Deploy production Workers
        env:
          APPS: ${{ needs.validate.outputs.apps }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_UNSUBSCRIBE_SECRET: ${{ secrets.RESEND_UNSUBSCRIBE_SECRET }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID repository secret is required'; exit 1; }
          test -n "$CLOUDFLARE_ZONE_ID" || { echo 'CLOUDFLARE_ZONE_ID repository secret is required'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN repository secret is required'; exit 1; }
          # Keep the pre-cutover version IDs available for rollback, including failed releases.
          mkdir -p rollback-versions
          for app in portfolio garden; do
            if [[ " $APPS " == *" $app "* ]]; then
              npm exec -- wrangler deployments list --config "apps/$app/wrangler.jsonc" --json | tee "rollback-versions/$app.json"
            fi
          done
          # Release the shared signup API before its form consumers.
          if [[ " $APPS " == *" portfolio "* ]]; then
            test -n "$RESEND_API_KEY" || { echo 'RESEND_API_KEY repository secret is required'; exit 1; }
            printf '%s' "$RESEND_API_KEY" | npm exec -- wrangler secret put RESEND_API_KEY --config apps/portfolio/wrangler.jsonc
            test -n "$RESEND_UNSUBSCRIBE_SECRET" || { echo 'RESEND_UNSUBSCRIBE_SECRET repository secret is required'; exit 1; }
            printf '%s' "$RESEND_UNSUBSCRIBE_SECRET" | npm exec -- wrangler secret put RESEND_UNSUBSCRIBE_SECRET --config apps/portfolio/wrangler.jsonc
            npm exec -- wrangler deploy --config apps/portfolio/wrangler.jsonc
          fi
          for app in $APPS; do
            [ "$app" = portfolio ] && continue
            if [ "$app" = garden ]; then
              # Never activate redirects before their published destination is readable.
              node --input-type=module <<'JS'
          import { setTimeout } from 'node:timers/promises'

          const url = 'https://n3wth.com/thinking/frameworks/5-whys'
          for (let attempt = 1; attempt <= 12; attempt++) {
            try {
              const response = await fetch(url, { redirect: 'manual', signal: AbortSignal.timeout(30000) })
              const html = await response.text()
              if (response.status !== 200 ||
                  !html.includes(`<link rel="canonical" href="${url}"`) ||
                  !html.includes('The 5 Whys is a framework for identifying root causes of problems.') ||
                  !html.includes('id="usage"')) {
                throw new Error(`Note readiness failed (HTTP ${response.status}, canonical or body missing)`)
              }
              console.log(`Verified published note before Garden cutover: ${url}`)
              break
            } catch (error) {
              if (attempt === 12) throw error
              console.log(`Waiting for portfolio note (${attempt}/12): ${error.message}`)
              await setTimeout(5000)
            }
          }
          JS
            fi
            npm exec -- wrangler deploy --config "apps/$app/wrangler.jsonc"
          done
      - name: Preserve pre-release Worker versions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rollback-versions-${{ github.sha }}
          path: rollback-versions/
          if-no-files-found: ignore
      - name: Check production readiness
        env:
          APPS: ${{ needs.validate.outputs.apps }}
        shell: bash
        run: |
          for app in $APPS; do
            case "$app" in
              ui-docs) host='ui.n3wth.com' ;;
              portfolio) host='n3wth.com' ;;
              garden) host='garden.n3wth.com' ;;
              skills) host='skills.n3wth.com' ;;
              r3-web) host='r3.n3wth.com' ;;
              *) echo "Unknown production app: $app"; exit 1 ;;
            esac
            url="https://$host/"
            echo "Checking $url"
            if ! status="$(curl --retry 12 --retry-delay 5 --retry-all-errors --silent --show-error --location --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "$url")"; then
              echo "$url could not be reached"
              exit 1
            fi
            test "$status" = 200 || { echo "$url returned HTTP $status"; exit 1; }
          done
