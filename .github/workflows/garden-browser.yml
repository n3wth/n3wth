name: Garden browser

on:
  pull_request:
    paths: ['apps/garden/**', 'packages/site-config/**', 'package-lock.json', 'playwright.garden.config.ts', 'tests/garden/**', '.github/workflows/garden-browser.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run build -w @n3wth/garden
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.garden.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garden-browser-evidence
          path: test-results/
          retention-days: 7
