name: Site CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: n3wth/ui/.github/workflows/site-check.yml@b581cab69af42366ebe8ac01448460bd57d0a8e4
    with:
      check-command: npm run check
