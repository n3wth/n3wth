name: Site CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check / check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify repository invariants
        run: node --test scripts/workspace/check-invariants.test.mjs && node scripts/workspace/check-invariants.mjs
      - name: Verify newsletter import safeguards
        run: node --test scripts/migrations/resend-newsletter-import.test.mjs
      - name: Select affected workspaces
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          echo "workspaces=$(node scripts/workspace/affected.mjs --base "$BASE_SHA" --list)" >> "$GITHUB_OUTPUT"
          echo "ui_package=$(node scripts/workspace/affected.mjs --base "$BASE_SHA" --ui-package)" >> "$GITHUB_OUTPUT"
      - run: npm install --global npm@11.19.1
        if: steps.affected.outputs.workspaces != '[]'
      - run: npm ci
        if: steps.affected.outputs.workspaces != '[]'
      - name: Verify affected workspace selection
        run: node --test scripts/workspace/affected.test.mjs scripts/workspace/create-site.test.mjs scripts/workspace/build.test.mjs scripts/content/check-built-metadata.test.mjs scripts/cloudflare/cloudflare-preview.test.mjs scripts/cloudflare/cloudflare-preview-config.test.mjs
      - name: Check affected workspaces
        if: steps.affected.outputs.workspaces != '[]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/workspace/affected.mjs --base "$BASE_SHA"
      - name: Check built metadata
        if: steps.affected.outputs.workspaces != '[]'
        env:
          AFFECTED_WORKSPACES: ${{ steps.affected.outputs.workspaces }}
        run: npm run check:metadata
      - name: Check newsletter forms
        if: contains(steps.affected.outputs.workspaces, '@n3wth/portfolio') || contains(steps.affected.outputs.workspaces, '@n3wth/ui-docs') || contains(steps.affected.outputs.workspaces, '@n3wth/garden') || contains(steps.affected.outputs.workspaces, '@n3wth/r3-web')
        run: npm run test:newsletter
      - name: Check article figure evidence and assets
        if: contains(steps.affected.outputs.workspaces, '@n3wth/garden')
        run: node docs/editorial/visuals/check.mjs
      - name: Verify shared site design resolution
        if: contains(steps.affected.outputs.workspaces, '@n3wth/ui')
        run: npm run check:design
      - name: Install browser
        if: contains(steps.affected.outputs.workspaces, '@n3wth/ui') || contains(steps.affected.outputs.workspaces, '@n3wth/portfolio') || contains(steps.affected.outputs.workspaces, '@n3wth/ui-docs') || contains(steps.affected.outputs.workspaces, '@n3wth/garden') || contains(steps.affected.outputs.workspaces, '@n3wth/r3-web')
        run: npx playwright install --with-deps chromium
      - name: Check standalone UI package
        if: contains(steps.affected.outputs.workspaces, '@n3wth/ui') && steps.affected.outputs.ui_package == 'true'
        run: npm run check:package
      - name: Check site browsers
        if: contains(steps.affected.outputs.workspaces, '@n3wth/portfolio') || contains(steps.affected.outputs.workspaces, '@n3wth/ui-docs') || contains(steps.affected.outputs.workspaces, '@n3wth/garden') || contains(steps.affected.outputs.workspaces, '@n3wth/r3-web')
        run: npm run check:browser -- --output=test-results/sites
        env:
          AFFECTED_WORKSPACES: ${{ steps.affected.outputs.workspaces }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence
          retention-days: 7
          path: |
            playwright-report
            test-results
