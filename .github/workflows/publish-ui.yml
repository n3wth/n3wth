name: Release UI

on:
  push:
    tags: ['ui-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ui
  cancel-in-progress: false

jobs:
  publish:
    if: vars.UI_NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --workspace @n3wth/ui --include-workspace-root
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/ui-v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./packages/ui/package.json').version")
          if [ "$TAG" != "ui-v$version" ]; then
            echo "Tag $TAG does not match packages/ui version $version" >&2
            exit 1
          fi
      - run: npm run check --workspace @n3wth/ui
      - run: npx playwright install --with-deps chromium
      - run: npm run check:package
      # publish-ui.mjs skips versions already on the registry, so a manual
      # dispatch on main is a safe smoke test.
      - run: node scripts/publish-ui.mjs
