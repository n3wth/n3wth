<title id="title">An inbox item is not yet a next action</title><desc id="desc">A captured item is checked for actionability. Non-actionable items are discarded, kept as reference, or held for later. Actionable items receive a visible next action and, when multistep, a project. Both paths feed organized reminders and review.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="835" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">An inbox item is not yet a next action</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">The clarify decision turns captured material into usable commitments</tspan></text><rect x="265" y="143" width="430" height="110" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="287" y="181" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="287" dy="0">One captured item</tspan></text><text x="287" y="221" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="287" dy="0">Clarify what it means.</tspan></text><path d="M480 253V281" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><rect x="285" y="294" width="390" height="76" rx="0" fill="#e8e8ed" stroke="#c7c7cc" stroke-width="2"/><text x="480" y="342" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan x="480" dy="0">Is there an action to take?</tspan></text><path d="M285 332H210V418" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M675 332H750V418" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><text x="140" y="395" font-size="24" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="140" dy="0">NO</tspan></text><text x="768" y="395" font-size="24" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="768" dy="0">YES</tspan></text><rect x="40" y="430" width="385" height="205" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="62" y="468" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">Decide its destination</tspan></text><text x="62" y="508" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">Discard it</tspan><tspan x="62" dy="32.5">Keep as reference</tspan><tspan x="62" dy="32.5">Hold for possible later action</tspan></text><rect x="510" y="430" width="410" height="205" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="532" y="468" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="532" dy="0">Define the next action</tspan></text><text x="532" y="508" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="532" dy="0">Name a visible next step.</tspan><tspan x="532" dy="32.5">If several steps are needed,</tspan><tspan x="532" dy="32.5">also record the project.</tspan></text><path d="M210 635V670H750V635" fill="none" stroke="#6e6e73" stroke-width="3"/><path d="M480 670V699" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="737" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan x="480" dy="0">Organize reminders → review them → choose an action</tspan></text><path d="M40 773H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="807" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
