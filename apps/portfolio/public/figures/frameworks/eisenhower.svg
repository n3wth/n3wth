<title id="title">Urgency and importance are separate</title><desc id="desc">A two-by-two matrix puts do and schedule in the important row, delegate or avoid and remove in the less important row. A live outage is urgent and important; preventive testing is important but not urgent.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="805" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Urgency and importance are separate</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Illustrative tasks: classify them in the context of your own role</tspan></text><text x="286" y="167" font-size="24" font-weight="600" fill="#6e6e73" text-anchor="middle"><tspan x="286" dy="0">URGENT</tspan></text><text x="708" y="167" font-size="24" font-weight="600" fill="#6e6e73" text-anchor="middle"><tspan x="708" dy="0">NOT URGENT</tspan></text><rect x="90" y="195" width="390" height="185" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="112" y="233" font-size="28" font-weight="600" fill="#8a1006" text-anchor="start"><tspan x="112" dy="0">Do</tspan></text><text x="112" y="273" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="112" dy="0">Important + urgent</tspan><tspan x="112" dy="32.5">Resolve a live outage.</tspan></text><rect x="510" y="195" width="390" height="185" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="532" y="233" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="532" dy="0">Schedule</tspan></text><text x="532" y="273" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="532" dy="0">Important + not urgent</tspan><tspan x="532" dy="32.5">Plan preventive testing.</tspan></text><rect x="90" y="414" width="390" height="185" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="112" y="452" font-size="28" font-weight="600" fill="#6b5803" text-anchor="start"><tspan x="112" dy="0">Delegate / avoid</tspan></text><text x="112" y="492" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="112" dy="0">Not important + urgent</tspan><tspan x="112" dy="32.5">Route a routine request.</tspan></text><rect x="510" y="414" width="390" height="185" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="532" y="452" font-size="28" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="532" dy="0">Remove</tspan></text><text x="532" y="492" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="532" dy="0">Neither</tspan><tspan x="532" dy="32.5">Drop a pointless status task.</tspan></text><text x="40" y="666" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Importance: does it serve a meaningful goal?</tspan><tspan x="40" dy="33.800000000000004">Urgency: does it require attention now?</tspan></text><path d="M40 743H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="777" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
