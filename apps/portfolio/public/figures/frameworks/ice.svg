<title id="title">Make the assumptions reviewable</title><desc id="desc">A worksheet maps Impact to business effects, Confidence to research and past tests, and Ease to the smallest credible test and delivery estimate. Comparable estimates create a shortlist for discussion, not a guarantee of outcomes.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="845" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Make the assumptions reviewable</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">ICE is a comparison aid; a score is not an observed outcome</tspan></text><text x="40" y="155" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">ESTIMATE</tspan></text><text x="275" y="155" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="275" dy="0">QUESTION</tspan></text><text x="620" y="155" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="620" dy="0">EVIDENCE TO BRING</tspan></text><path d="M40 182H920" fill="none" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="243" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="60" dy="0">Impact</tspan></text><text x="275" y="227" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="275" dy="0">If it works, what</tspan><tspan x="275" dy="32.5">goal could it move?</tspan></text><text x="620" y="227" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="620" dy="0">A model of the business</tspan><tspan x="620" dy="32.5">and the affected users.</tspan></text><path d="M40 324H920" fill="none" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="385" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="60" dy="0">Confidence</tspan></text><text x="275" y="369" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="275" dy="0">Why do we think</tspan><tspan x="275" dy="32.5">this test will work?</tspan></text><text x="620" y="369" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="620" dy="0">Customer research and</tspan><tspan x="620" dy="32.5">results of earlier tests.</tspan></text><path d="M40 466H920" fill="none" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="527" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="60" dy="0">Ease</tspan></text><text x="275" y="511" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="275" dy="0">What is the smallest</tspan><tspan x="275" dy="32.5">credible test?</tspan></text><text x="620" y="511" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="620" dy="0">A delivery estimate</tspan><tspan x="620" dy="32.5">from the people doing it.</tspan></text><rect x="40" y="649" width="880" height="100" rx="0" fill="#e8e8ed" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="689" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="60" dy="0">Use comparable estimates to shortlist ideas.</tspan><tspan x="60" dy="33.800000000000004">Review their merits before committing resources.</tspan></text><path d="M40 783H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="817" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
