<title id="title">A coaching conversation can loop back</title><desc id="desc">Goal and Reality lead to a branching Options discussion, then converge on Will: an action, a date and a review. A dashed return path shows that new insight may require revisiting earlier questions.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="850" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">A coaching conversation can loop back</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Questions first; the person being coached chooses the commitment</tspan></text><rect x="40" y="150" width="410" height="150" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="62" y="188" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="62" dy="0">Goal</tspan></text><text x="62" y="228" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">What would success look like?</tspan><tspan x="62" dy="32.5">Name an observable outcome.</tspan></text><rect x="510" y="150" width="410" height="150" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="532" y="188" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="532" dy="0">Reality</tspan></text><text x="532" y="228" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="532" dy="0">What is happening now?</tspan><tspan x="532" dy="32.5">Separate evidence from guesses.</tspan></text><path d="M450 225H497" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M715 300V341H480V368" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="396" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan x="480" dy="0">Options: explore before committing</tspan></text><path d="M480 410V436H225V458" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M480 436H735V458" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="470" width="310" height="78" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="225" y="519" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="middle"><tspan x="225" dy="0">Try a different approach</tspan></text><rect x="580" y="470" width="310" height="78" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="735" y="519" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="middle"><tspan x="735" dy="0">Ask for support</tspan></text><path d="M225 548V578H735V548" fill="none" stroke="#6e6e73" stroke-width="3"/><path d="M480 578V610" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><rect x="130" y="624" width="700" height="130" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="152" y="662" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="152" dy="0">Will: make the next step concrete</tspan></text><text x="152" y="702" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="152" dy="0">Choose an action, a date and a way to review progress.</tspan></text><path d="M830 688H933V132H245V138" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M40 788H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="822" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
