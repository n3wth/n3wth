<title id="title">The boundary is inside versus outside</title><desc id="desc">A SWOT matrix separates internal support skills and onboarding limits from external demand and competition. Each factor is paired with a possible next action for launching a viable support service.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="810" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">The boundary is inside versus outside</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">An illustrative analysis tied to a specific objective</tspan></text><text x="295" y="157" font-size="24" font-weight="600" fill="#6e6e73" text-anchor="middle"><tspan x="295" dy="0">SUPPORTS THE GOAL</tspan></text><text x="725" y="157" font-size="24" font-weight="600" fill="#6e6e73" text-anchor="middle"><tspan x="725" dy="0">HINDERS THE GOAL</tspan></text><rect x="90" y="187" width="385" height="195" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="112" y="225" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="112" dy="0">Strengths • internal</tspan></text><text x="112" y="265" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="112" dy="0">Established support skills</tspan><tspan x="112" dy="32.5">Action: use them in</tspan><tspan x="112" dy="32.5">the service launch.</tspan></text><rect x="505" y="187" width="385" height="195" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="527" y="225" font-size="28" font-weight="600" fill="#8a1006" text-anchor="start"><tspan x="527" dy="0">Weaknesses • internal</tspan></text><text x="527" y="265" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="527" dy="0">Limited onboarding capacity</tspan><tspan x="527" dy="32.5">Action: address the</tspan><tspan x="527" dy="32.5">training bottleneck.</tspan></text><rect x="90" y="420" width="385" height="195" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="112" y="458" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="112" dy="0">Opportunities • external</tspan></text><text x="112" y="498" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="112" dy="0">New demand in the market</tspan><tspan x="112" dy="32.5">Action: investigate</tspan><tspan x="112" dy="32.5">an underserved segment.</tspan></text><rect x="505" y="420" width="385" height="195" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="527" y="458" font-size="28" font-weight="600" fill="#8a1006" text-anchor="start"><tspan x="527" dy="0">Threats • external</tspan></text><text x="527" y="498" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="527" dy="0">New competing service</tspan><tspan x="527" dy="32.5">Action: test whether</tspan><tspan x="527" dy="32.5">customers may switch.</tspan></text><text x="40" y="685" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Example objective: launch a viable support service.</tspan><tspan x="40" dy="32.5">Separate what you can change from what you must respond to.</tspan></text><path d="M40 748H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="782" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
