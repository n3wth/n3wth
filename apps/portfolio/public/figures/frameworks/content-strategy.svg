<title id="title">Publication starts a maintenance obligation</title><desc id="desc">A content lifecycle links user need, format and placement, publication and maintenance, and review. Review asks whether the need and information are still current, then chooses to keep, revise, or retain the content as a historical record.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="815" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Publication starts a maintenance obligation</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">A conceptual lifecycle organized around an evidenced user need</tspan></text><rect x="40" y="146" width="405" height="151" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="62" y="184" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="62" dy="0">Start with a user need</tspan></text><text x="62" y="224" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">What must someone</tspan><tspan x="62" dy="32.5">understand or do?</tspan></text><rect x="515" y="146" width="405" height="151" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="537" y="184" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="537" dy="0">Choose the right content</tspan></text><text x="537" y="224" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="537" dy="0">Decide format, amount</tspan><tspan x="537" dy="32.5">and where it belongs.</tspan></text><path d="M445 222H502" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M717 297V337" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="350" width="405" height="150" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="537" y="388" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="537" dy="0">Publish and maintain</tspan></text><text x="537" y="428" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="537" dy="0">Check that the content</tspan><tspan x="537" dy="32.5">continues to meet the need.</tspan></text><path d="M515 425H462" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="350" width="405" height="150" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="62" y="388" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">Review what changed</tspan></text><text x="62" y="428" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">Is the need still current?</tspan><tspan x="62" dy="32.5">Is the information still right?</tspan></text><path d="M240 350V310" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M240 500V542H480V565" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="580" width="880" height="136" rx="0" fill="#e8e8ed" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="621" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="60" dy="0">Choose the maintenance action</tspan></text><text x="60" y="666" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="60" dy="0">Keep current • revise • retain as a clearly historical record</tspan></text><path d="M40 753H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="787" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
