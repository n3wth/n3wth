<title id="title">Presence and absence tell different stories</title><desc id="desc">A three-row comparison shows that missing basic needs dissatisfy, performance needs can satisfy or dissatisfy, and excitement needs may go unnoticed when absent but delight when present. Classifications should be based on user research.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="825" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Presence and absence tell different stories</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Three core need types; qualitative patterns, not satisfaction scores</tspan></text><text x="40" y="153" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">NEED TYPE</tspan></text><text x="350" y="153" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="350" dy="0">IF MISSING</tspan></text><text x="642" y="153" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="642" dy="0">IF PROVIDED WELL</tspan></text><path d="M40 182H920" fill="none" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="240" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="60" dy="0">Basic / expected</tspan></text><text x="350" y="238" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="350" dy="0">Dissatisfaction</tspan></text><text x="642" y="231" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="642" dy="0">Expectation met;</tspan><tspan x="642" dy="32.5">little extra delight.</tspan></text><path d="M40 337H920" fill="none" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="395" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="60" dy="0">Performance</tspan></text><text x="350" y="393" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="350" dy="0">Dissatisfaction</tspan></text><text x="642" y="386" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="642" dy="0">More fulfillment</tspan><tspan x="642" dy="32.5">can add satisfaction.</tspan></text><path d="M40 492H920" fill="none" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="550" font-size="27" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="60" dy="0">Excitement</tspan></text><text x="350" y="548" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="350" dy="0">May not be missed</tspan></text><text x="642" y="541" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="642" dy="0">Unexpected value</tspan><tspan x="642" dy="32.5">can delight.</tspan></text><text x="480" y="721" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan x="480" dy="0">Base classifications on user research.</tspan></text><path d="M40 763H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="797" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
