<title id="title">Four risks behind a product decision</title><desc id="desc">Value and viability sit with product management, usability with design, and feasibility with engineering. All four connect to collaborative discovery. Each risk includes a question and the kind of evidence needed.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="840" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Four risks behind a product decision</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">A responsibility map for an empowered product team</tspan></text><text x="62" y="189" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="62" dy="0">Value • product manager</tspan></text><text x="62" y="229" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">Will people choose it?</tspan><tspan x="62" dy="32.5">Evidence about the problem</tspan><tspan x="62" dy="32.5">and the proposed benefit.</tspan></text><text x="527" y="189" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="527" dy="0">Viability • product manager</tspan></text><text x="527" y="229" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="527" dy="0">Will it work for the business?</tspan><tspan x="527" dy="32.5">Economics, channels,</tspan><tspan x="527" dy="32.5">contracts and constraints.</tspan></text><text x="62" y="544" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="62" dy="0">Usability • designer</tspan></text><text x="62" y="584" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">Can people use it?</tspan><tspan x="62" dy="32.5">Observe users trying</tspan><tspan x="62" dy="32.5">the proposed experience.</tspan></text><text x="527" y="544" font-size="28" font-weight="600" fill="#6b5803" text-anchor="start"><tspan x="527" dy="0">Feasibility • engineer</tspan></text><text x="527" y="584" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="527" dy="0">Can we build it?</tspan><tspan x="527" dy="32.5">Check skills, technology</tspan><tspan x="527" dy="32.5">and the available time.</tspan></text><path d="M247 328V359H480V380" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M712 328V359H480" fill="none" stroke="#6e6e73" stroke-width="3"/><path d="M247 506V472H480V453" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M712 506V472H480" fill="none" stroke="#6e6e73" stroke-width="3"/><rect x="250" y="393" width="460" height="48" rx="0" fill="#e8e8ed" stroke="#e8e8ed" stroke-width="2"/><text x="480" y="425" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan x="480" dy="0">Discover the solution together</tspan></text><text x="40" y="743" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Clear responsibility still requires collaboration across risks.</tspan></text><path d="M40 778H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="812" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
