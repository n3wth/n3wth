<text x="40" y="54" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Write the relationship, then add the link</text><text x="40" y="110" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">A useful edge can be read as a sentence.</text><rect x="40" y="157" width="249" height="75" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="164" y="204" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle">Practice</text><line x1="292" y1="195" x2="662" y2="195" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="370" y="157" width="172" height="36" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="378" y="184" font-size="22" font-weight="400" fill="#1d1d1f" text-anchor="start">is a form of</text><rect x="669" y="157" width="251" height="75" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="794" y="204" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle">Learning</text><rect x="40" y="295" width="249" height="75" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="164" y="342" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle">Feedback</text><line x1="292" y1="333" x2="662" y2="333" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="413" y="295" width="94" height="36" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="421" y="322" font-size="22" font-weight="400" fill="#1d1d1f" text-anchor="start">guides</text><rect x="669" y="295" width="251" height="75" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="794" y="342" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle">Practice</text><rect x="40" y="433" width="249" height="75" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="164" y="480" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle">Practice note</text><line x1="292" y1="471" x2="662" y2="471" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="340" y="433" width="289" height="36" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="348" y="460" font-size="22" font-weight="400" fill="#1d1d1f" text-anchor="start">compares methods with</text><rect x="669" y="433" width="251" height="75" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="794" y="480" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle">Revision note</text><text x="40" y="577" font-size="25" font-weight="600" fill="#1d1d1f" text-anchor="start">Check: is the phrase precise, useful and supported by the notes?</text>
