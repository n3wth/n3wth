<title id="title">Write the relationship, then add the link</title>
<desc id="desc">Three labeled connections distinguish a narrower concept, a supporting condition and a cross-topic relationship: practice is a form of learning; feedback guides practice; note linking connects practice notes to revision notes. A check asks whether the connecting phrase makes a defensible sentence.</desc>
