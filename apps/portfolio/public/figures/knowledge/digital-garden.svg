ght="400" fill="#1d1d1f" text-anchor="middle">Recall</text><rect x="725" y="318" width="191" height="73" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="820" y="364" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="middle">Practice</text><rect x="577" y="463" width="249" height="73" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="701" y="509" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="middle">Feedback</text><text x="60" y="541" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start">Date is the route.</text>
