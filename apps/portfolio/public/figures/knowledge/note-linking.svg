<title id="title">A backlink is a route back</title>
<desc id="desc">An illustrative Practice note has a contextual link saying it uses guidance from a Feedback note. The Feedback note exposes a backlink to the Practice note. The reverse navigation does not change the meaning of the original relationship.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e6e73"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect width="960" height="651" fill="#f5f5f7"/>
<text x="40" y="54" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">A backlink is a route back</text><text x="62" y="178" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Practice note</text><text x="62" y="217" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">This attempt uses guidance</text><text x="62" y="253" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">from the feedback note.</text><text x="585" y="178" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Feedback note</text><text x="585" y="217" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Describe the observation</text><text x="585" y="253" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">that changes the next try.</text><line x1="399" y1="224" x2="557" y2="224" stroke="#0071a4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="129" font-size="23" font-weight="600" fill="#1d1d1f" text-anchor="middle">uses guidance from</text><path d="M 742 310 V 414 H 220 V 313" fill="none" stroke="#6e6e73" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="383" y="376" width="159" height="36" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="391" y="403" font-size="22" font-weight="400" fill="#1d1d1f" text-anchor="start">linked from</text><rect x="105" y="455" width="750" height="98" rx="0" fill="#ffffff" stroke="#e8e8ed" stroke-width="1.5"/><text x="480" y="494" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="middle">The forward link states a relationship.</text><text x="480" y="531" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="middle">The backlink helps you return to the referring note.</text>
<line x1="40" y1="588" x2="920" y2="588" stroke="#e8e8ed" stroke-width="2.5"/><text x="40" y="624" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual schematic · examples are illustrative</text>
</g>
</svg>
