<title id="title">Repeat a revised attempt</title>
<desc id="desc">An expert helps choose a specific target and practice task. The learner attempts the task, compares immediate feedback with the target, adjusts one feature and retries. A second review checks whether the goal should change.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e6e73"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect width="960" height="704" fill="#f5f5f7"/>
<text x="40" y="54" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Repeat a revised attempt</text><text x="62" y="143" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Expert-guided target</text><text x="62" y="182" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Choose a task and a clear standard for this learner.</text><text x="97" y="310" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Attempt</text><text x="97" y="349" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Perform the specific task.</text><text x="562" y="310" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Compare</text><text x="562" y="349" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Use immediate feedback.</text><text x="562" y="512" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Adjust</text><text x="562" y="551" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Change the weak feature.</text><text x="97" y="512" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Retry</text><text x="97" y="551" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Repeat with the revision.</text><line x1="420" y1="331" x2="536" y2="331" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="712" y1="392" x2="712" y2="470" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="539" y1="533" x2="425" y2="533" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="247" y1="474" x2="247" y2="394" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="247" y1="214" x2="247" y2="268" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="412" y="412" width="133" height="36" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="420" y="439" font-size="22" font-weight="400" fill="#1d1d1f" text-anchor="start">same goal</text><path d="M 885 530 H 918 V 162 H 905" fill="none" stroke="#6e6e73" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<line x1="40" y1="641" x2="920" y2="641" stroke="#e8e8ed" stroke-width="2.5"/><text x="40" y="677" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual schematic · examples are illustrative</text>
</g>
