<title id="title">Tie the plan to evidence of learning</title>
<desc id="desc">A planning grid connects three moments to their questions and records: before learning choose a demonstrable target, during learning check understanding with an attempt, after learning compare the result with the target and revise the plan.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e6e73"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect width="960" height="748" fill="#f5f5f7"/>
<text x="40" y="54" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Tie the plan to evidence of learning</text><rect x="40" y="116" width="880" height="59" rx="0" fill="#1d1d1f" stroke="#1d1d1f" stroke-width="1.5"/><text x="61" y="155" font-size="25" font-weight="600" fill="#ffffff" text-anchor="start">Moment</text><text x="252" y="155" font-size="25" font-weight="600" fill="#ffffff" text-anchor="start">Question to ask</text><text x="604" y="155" font-size="25" font-weight="600" fill="#ffffff" text-anchor="start">Evidence to keep</text><rect x="40" y="175" width="880" height="128" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="61" y="222" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start">Before</text><text x="252" y="218" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">What should I be able</text><text x="252" y="254" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">to demonstrate?</text><text x="604" y="218" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">A target, a method</text><text x="604" y="254" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">and a success criterion</text><rect x="40" y="303" width="880" height="128" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="61" y="350" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start">During</text><text x="252" y="346" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">Can I do it without</text><text x="252" y="382" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">following the example?</text><text x="604" y="346" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">An attempt, a quiz</text><text x="604" y="382" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">or an explanation</text><rect x="40" y="431" width="880" height="128" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="61" y="478" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start">After</text><text x="252" y="474" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">What worked, and what</text><text x="252" y="510" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">should change next?</text><text x="604" y="474" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">A result compared</text><text x="604" y="510" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">with the original target</text><path d="M 908 564 V 601 H 56 V 563" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="632" font-size="25" font-weight="600" fill="#1d1d1f" text-anchor="middle">Use the comparison to revise the next plan.</text>
<line x1="40" y1="685" x2="920" y2="685" stroke="#e8e8ed" stroke-width="2.5"/><text x="40" y="721" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual schematic · examples are illustrative</text>
</g>
</svg>
