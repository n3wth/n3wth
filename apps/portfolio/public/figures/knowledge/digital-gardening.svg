<title id="title">Publish the state of the idea</title>
<desc id="desc">Three maturity states describe what readers can expect: seed contains a question, growing contains evidence and competing explanations, evergreen contains a stable synthesis. Every state remains open to revision.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e6e73"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect width="960" height="663" fill="#f5f5f7"/>
<text x="40" y="54" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Publish the state of the idea</text><text x="62" y="174" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Seed</text><text x="62" y="213" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Question or hunch</text><text x="62" y="249" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">What is unresolved?</text><text x="62" y="285" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Show the uncertainty.</text><text x="367" y="174" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Growing</text><text x="367" y="213" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Evidence and links</text><text x="367" y="249" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">What changed?</text><text x="367" y="285" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Test explanations.</text><text x="672" y="174" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Evergreen</text><text x="672" y="213" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Stable synthesis</text><text x="672" y="249" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">What are its limits?</text><text x="672" y="285" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Keep it revisable.</text><line x1="312" y1="243" x2="341" y2="243" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="617" y1="243" x2="646" y2="243" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 785 365 V 427 H 175 V 370" fill="none" stroke="#6e6e73" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="165" y="454" width="630" height="102" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="480" y="493" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="middle">New evidence can reopen any note.</text><text x="480" y="528" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="middle">Maturity describes development, not certainty.</text>
<line x1="40" y1="600" x2="920" y2="600" stroke="#e8e8ed" stroke-width="2.5"/><text x="40" y="636" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual schematic · examples are illustrative</text>
</g>
</svg>
