<title id="title">Separate names, hierarchy and association</title>
<desc id="desc">The preferred label Note taking has an alternative label Taking notes. It is narrower than Knowledge management and broader than Atomic notes. Note linking is an associated concept rather than an alias or necessarily a child.</desc>
