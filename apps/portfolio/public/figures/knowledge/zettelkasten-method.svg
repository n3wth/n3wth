<title id="title">Addresses and links do different jobs</title>
<desc id="desc">An illustrative keyword index points to card 12/1. A branch card 12/1a extends it between 12/1 and 12/2. A cross-reference reaches card 7/3 in another sequence. Stable addresses allow both ordered neighbors and links to distant ideas.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e6e73"/></marker></defs>
