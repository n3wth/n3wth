<title id="title">Rate the answer you recalled</title>
<desc id="desc">After attempting recall and revealing the answer, an incorrect or missing answer leads to Again. A correct answer branches by effort: Hard for slow or doubtful recall, Good for some effort, Easy for no effort. The displayed next interval follows the rating.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e6e73"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect width="960" height="731" fill="#f5f5f7"/>
<text x="40" y="54" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Rate the answer you recalled</text><text x="480" y="112" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle">Attempt recall → reveal the answer → compare</text><rect x="310" y="150" width="340" height="74" rx="0" fill="#e8e8ed" stroke="#e8e8ed" stroke-width="1.5"/><text x="480" y="197" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle">Was the answer correct?</text><path d="M 309 187 H 167 V 296" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="155" y="221" width="42" height="36" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="163" y="248" font-size="22" font-weight="400" fill="#1d1d1f" text-anchor="start">No</text><text x="62" y="338" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Again</text><text x="62" y="377" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Incorrect, missing</text><text x="62" y="413" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">or not good enough</text><text x="62" y="449" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">for the real task.</text><path d="M 480 226 V 278 H 611 V 296" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="490" y="233" width="55" height="36" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="498" y="260" font-size="22" font-weight="400" fill="#1d1d1f" text-anchor="start">Yes</text><rect x="347" y="300" width="573" height="64" rx="0" fill="#ffffff" stroke="#0071a4" stroke-width="2"/><text x="634" y="342" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="middle">How much effort did recall take?</text><path d="M 633 366 V 402 H 392 V 443" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="633" y1="405" x2="633" y2="443" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 633 402 H 855 V 443" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="329" y="485" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Hard</text><text x="329" y="524" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Slow or</text><text x="329" y="560" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">doubtful</text><text x="540" y="485" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Good</text><text x="540" y="524" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Some</text><text x="540" y="560" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">mental effort</text><text x="752" y="485" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Easy</text><text x="752" y="524" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">No</text><text x="752" y="560" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">mental effort</text><text x="480" y="635" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="middle">Use the interval displayed by the chosen button.</text>
<line x1="40" y1="668" x2="920" y2="668" stroke="#e8e8ed" stroke-width="2.5"/><text x="40" y="704" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual schematic · examples are illustrative</text>
