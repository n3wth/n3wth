<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="810" viewBox="0 0 960 810" role="img" aria-labelledby="title desc">
<style data-site-theme="n3wth">
  [fill="#6e6e73"] { fill: #6e6e73; }
  [fill="#f5f5f7"] { fill: #f5f5f7; }
  [fill="#1d1d1f"] { fill: #1d1d1f; }
  [stroke="#6e6e73"] { stroke: #6e6e73; }
  [fill="#ffffff"] { fill: #ffffff; }
  [fill="#054a6b"] { fill: #054a6b; }
  [fill="#0a5c22"] { fill: #0a5c22; }
@media (prefers-color-scheme: dark) {
  [fill="#6e6e73"] { fill: #9aa0a8; }
  [fill="#f5f5f7"] { fill: #08090b; }
  [fill="#1d1d1f"] { fill: #f2f3f5; }
  [stroke="#6e6e73"] { stroke: #9aa0a8; }
  [fill="#ffffff"] { fill: #0d0e10; }
  [fill="#054a6b"] { fill: #a9e5ff; }
  [fill="#0a5c22"] { fill: #8ef2ab; }
