<title id="title">Food variety is a planning tool</title>
<desc id="desc">Four food-planning groups list vegetables, fruit and whole grains; beans, fish, poultry, nuts and seeds; low-fat dairy; vegetable oils and fewer sugary drinks. Equal panels do not indicate portion sizes.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="670" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="40" y="56" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Food variety is a planning tool</text>
<path d="M 40 82 L 920 82" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="128" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Build variety across meals</text><text x="62" y="191" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start">Plants + grains</text><text x="62" y="233" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Vegetables and fruit</text>
<text x="62" y="268" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Whole grains</text><text x="527" y="191" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start">Protein foods</text><text x="527" y="233" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Beans, fish and poultry</text>
<text x="527" y="268" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Nuts and seeds</text><text x="62" y="371" font-size="28" font-weight="600" fill="#054a6b" text-anchor="start">Dairy choices</text><text x="62" y="413" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Low-fat or fat-free</text>
<text x="62" y="448" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">milk, yogurt and similar foods</text><text x="527" y="371" font-size="28" font-weight="600" fill="#054a6b" text-anchor="start">Fats + drinks</text><text x="527" y="413" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Choose vegetable oils.</text>
<text x="527" y="448" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Limit sugary drinks.</text><text x="480" y="557" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="middle">Portions vary with needs; this is not a macro target.</text>
<path d="M 40 613 L 920 613" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="647" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual diagram • not measured data</text>
</g>
</svg>
