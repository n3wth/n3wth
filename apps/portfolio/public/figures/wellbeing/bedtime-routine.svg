<text x="40" y="56" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">A routine begins before bedtime</text>
<path d="M 40 82 L 920 82" fill="none" stroke="#6e6e73" stroke-width="3"/>
<path d="M 80 222 L 880 222" fill="none" stroke="#6e6e73" stroke-width="3"/><circle cx="80" cy="222" r="9" fill="#ffffff" stroke="#1d1d1f" stroke-width="3"/><circle cx="344" cy="222" r="9" fill="#ffffff" stroke="#1d1d1f" stroke-width="3"/><circle cx="608" cy="222" r="9" fill="#ffffff" stroke="#1d1d1f" stroke-width="3"/><circle cx="872" cy="222" r="9" fill="#ffffff" stroke="#1d1d1f" stroke-width="3"/><text x="80" y="163" font-size="24" font-weight="600" fill="#6e6e73" text-anchor="start">DAYTIME</text><text x="324" y="163" font-size="24" font-weight="600" fill="#6e6e73" text-anchor="start">EVENING</text><text x="580" y="163" font-size="24" font-weight="600" fill="#6e6e73" text-anchor="start">BEDTIME</text><text x="40" y="288" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">Time outdoors</text>
<text x="40" y="324" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">and physical</text>
<text x="40" y="360" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">activity.</text><text x="304" y="288" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">Quiet wind-down;</text>
<text x="304" y="324" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">reduce bright</text>
<text x="304" y="360" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">artificial light.</text><text x="576" y="288" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">A quiet, cool,</text>
<text x="576" y="324" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">dark room.</text><path d="M872 232V472H20V222H70" fill="none" stroke="#6e6e73" stroke-width="3"/><rect x="187" y="430" width="586" height="88" rx="0" fill="#f5f5f7" stroke="#f5f5f7" stroke-width="2"/><text x="480" y="466" font-size="27" font-weight="600" fill="#054a6b" text-anchor="middle">Repeat consistent bed and wake times</text><text x="480" y="501" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="middle">Adjust the routine to your circumstances.</text><text x="40" y="579" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Sequence is illustrative; spacing does not represent elapsed time.</text>
