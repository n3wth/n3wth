<title id="title">A routine begins before bedtime</title>
<desc id="desc">Illustrative timeline links daytime outdoor activity to an evening wind-down and a quiet, cool, dark sleep environment. A return loop emphasizes consistent bed and wake times, with no prescribed clock times.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="660" fill="#f5f5f7"/>
