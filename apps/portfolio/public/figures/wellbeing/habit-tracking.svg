<title id="title">Track context, then adjust the plan</title>
<desc id="desc">An explicitly fictional habit log contains a completed lunch walk with a settled feeling and a rain-related missed walk with frustration. A review points to an indoor option and resuming the routine.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="790" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="40" y="56" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Track context, then adjust the plan</text>
<path d="M 40 82 L 920 82" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="127" font-size="24" font-weight="600" fill="#6e6e73" text-anchor="start">ILLUSTRATIVE LOG — NOT PERSONAL DATA</text><rect x="40" y="154" width="880" height="288" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/><text x="62" y="196" font-size="25" font-weight="600" fill="#1d1d1f" text-anchor="start">Planned habit</text><text x="347" y="196" font-size="25" font-weight="600" fill="#1d1d1f" text-anchor="start">What happened</text><text x="676" y="196" font-size="25" font-weight="600" fill="#1d1d1f" text-anchor="start">How it felt</text><path d="M 40 220 L 920 220" fill="none" stroke="#6e6e73" stroke-width="3"/><path d="M 325 154 L 325 442" fill="none" stroke="#6e6e73" stroke-width="3"/><path d="M 654 154 L 654 442" fill="none" stroke="#6e6e73" stroke-width="3"/><text x="62" y="271" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Walk after lunch</text><text x="347" y="271" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Walk completed</text><text x="676" y="271" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">More settled</text><path d="M 40 310 L 920 310" fill="none" stroke="#6e6e73" stroke-width="3"/><text x="62" y="362" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Walk after lunch</text><text x="347" y="362" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Rain; walk missed</text><text x="676" y="362" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Frustrated</text><path d="M 480 442 L 480 484" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><text x="202" y="540" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start">Review the obstacle</text><text x="202" y="582" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Try an indoor route on rainy days.</text>
<text x="202" y="617" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Resume at the next opportunity.</text><text x="40" y="701" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">A record should help you adjust, not just count a streak.</text>
<path d="M 40 733 L 920 733" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="767" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual diagram • not measured data</text>
</g>
</svg>
