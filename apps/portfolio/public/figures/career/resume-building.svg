<title id="title">Show the work and what changed</title>
<desc id="desc">An illustrative resume bullet says, Rebuilt the onboarding guide so new starters could complete setup independently. Annotations identify the action, rebuilt; the project, the onboarding guide; and the result, independent setup. A reminder asks writers to use numbers only when they have supporting evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="770" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Show the work and what changed</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><text x="45" y="154" font-size="22" fill="#6e6e73" font-weight="600" text-anchor="start">ILLUSTRATIVE ACCOMPLISHMENT STATEMENT</text><line x1="40" y1="342" x2="920" y2="342" stroke="#e8e8ed" stroke-width="2"/><text x="70" y="234" font-size="31" fill="#1d1d1f" font-weight="400" text-anchor="start">Rebuilt the onboarding guide so new starters</text>
<text x="70" y="279" font-size="31" fill="#1d1d1f" font-weight="400" text-anchor="start">could complete setup independently.</text><line x1="70" y1="390" x2="885" y2="390" stroke="#e8e8ed" stroke-width="2"/><text x="70" y="430" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Action</text><text x="235" y="430" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">Rebuilt</text><text x="535" y="430" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">What you personally did.</text><line x1="70" y1="478" x2="885" y2="478" stroke="#e8e8ed" stroke-width="2"/><text x="70" y="518" font-size="27" fill="#0a5c22" font-weight="600" text-anchor="start">Project</text><text x="235" y="518" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">The onboarding guide</text><text x="535" y="518" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">The work and its context.</text><line x1="70" y1="566" x2="885" y2="566" stroke="#e8e8ed" stroke-width="2"/><text x="70" y="606" font-size="27" fill="#6b5803" font-weight="600" text-anchor="start">Result</text><text x="235" y="606" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">Independent setup</text><text x="535" y="606" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">The outcome you can substantiate.</text><text x="45" y="678" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Use numbers when supported; a truthful qualitative result also helps.</text><text x="40" y="741" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
