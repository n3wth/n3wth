<title id="title">Connect search channels to a next action</title>
<desc id="desc">Three discovery channels—published roles, professional conversations and industry events—converge on a check of role fit. Qualified opportunities go into one record containing source, role evidence, status, next action and review date. A return arrow uses learning to adjust the search, without implying conversion rates.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="810" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Connect search channels to a next action</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><text x="45" y="155" font-size="22" fill="#054a6b" font-weight="600" text-anchor="start">DISCOVER</text><text x="412" y="155" font-size="22" fill="#054a6b" font-weight="600" text-anchor="start">QUALIFY</text><text x="715" y="155" font-size="22" fill="#054a6b" font-weight="600" text-anchor="start">FOLLOW THROUGH</text><line x1="40" y1="301" x2="350" y2="301" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="225" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Published roles</text><text x="62" y="266" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Employer job pages</text><line x1="40" y1="444" x2="350" y2="444" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="368" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Conversations</text><text x="62" y="409" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Peers and alumni</text><line x1="40" y1="587" x2="350" y2="587" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="511" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Events</text><text x="62" y="552" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Industry communities</text><path d="M 350 240 H 378 V 385 H 402" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 350 385 H 402" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 350 527 H 378 V 385" fill="none" stroke="#6e6e73" stroke-width="2.5"/><line x1="408" y1="461" x2="646" y2="461" stroke="#e8e8ed" stroke-width="2"/><text x="430" y="349" font-size="26" fill="#0a5c22" font-weight="600" text-anchor="start">Role fits goals</text>
<text x="430" y="383" font-size="26" fill="#0a5c22" font-weight="600" text-anchor="start">and constraints?</text><text x="430" y="424" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Investigate gaps.</text><path d="M 646 385 H 685" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="693" y1="551" x2="920" y2="551" stroke="#e8e8ed" stroke-width="2"/><text x="713" y="261" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">One record</text><text x="713" y="308" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Source</text>
<text x="713" y="355" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Role evidence</text>
<text x="713" y="402" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Current status</text>
<text x="713" y="449" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Next action</text>
<text x="713" y="496" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Review date</text><path d="M 804 551 V 630 H 196 V 592" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="300" y="670" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Review what you learn; adjust where you search.</text><text x="40" y="781" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
