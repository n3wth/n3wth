<title id="title">Design an assignment that teaches</title>
<desc id="desc">A leadership development assignment is supported by three conditions: assessment through feedback on a specific gap, a challenge that requires new coordination skills, and support through mentoring and peer check-ins. A review asks what changed in behavior and what to try next.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="800" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Design an assignment that teaches</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><line x1="40" y1="246" x2="920" y2="246" stroke="#e8e8ed" stroke-width="2"/><text x="65" y="185" font-size="28" fill="#1d1d1f" font-weight="600" text-anchor="start">Development challenge: lead a cross-team project</text><text x="65" y="223" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">An illustrative assignment, bounded by agreed goals and support.</text><line x1="40" y1="525" x2="320" y2="525" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="320" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Assessment</text><text x="62" y="361" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Ask for feedback</text>
<text x="62" y="395" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">on planning and</text>
<text x="62" y="429" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">collaboration.</text>
<text x="62" y="463" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Name one gap.</text><line x1="340" y1="525" x2="620" y2="525" stroke="#e8e8ed" stroke-width="2"/><text x="362" y="320" font-size="27" fill="#0a5c22" font-weight="600" text-anchor="start">Challenge</text><text x="362" y="361" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Take responsibility</text>
<text x="362" y="395" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">for a new kind</text>
<text x="362" y="429" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">of coordination.</text>
<text x="362" y="463" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Practice the gap.</text><line x1="640" y1="525" x2="920" y2="525" stroke="#e8e8ed" stroke-width="2"/><text x="662" y="320" font-size="27" fill="#6b5803" font-weight="600" text-anchor="start">Support</text><text x="662" y="361" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Arrange a mentor</text>
<text x="662" y="395" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">and peer check-ins.</text>
<text x="662" y="429" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Make room to ask</text>
<text x="662" y="463" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">for help.</text><path d="M 180 525 V 554 H 480 V 581" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 480 525 V 581" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 780 525 V 554 H 480" fill="none" stroke="#6e6e73" stroke-width="2.5"/><line x1="115" y1="695" x2="845" y2="695" stroke="#e8e8ed" stroke-width="2"/><text x="140" y="624" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Review the experience</text><text x="140" y="663" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">What changed in your behavior? What should you try next?</text><text x="40" y="771" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
