<title id="title">Prepare evidence for the role</title>
<desc id="desc">Employer needs from a job description are matched to the candidate's own experience, actions and outcomes. Both feed a practice answer, spoken aloud and revised using feedback. A dashed return path supports revisiting the evidence. A collaboration requirement and real handoff story illustrate the matching step.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="800" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Prepare evidence for the role</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><line x1="40" y1="337" x2="455" y2="337" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="190" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Employer needs</text><text x="62" y="231" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Read the job description.</text>
<text x="62" y="265" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Name the capabilities</text>
<text x="62" y="299" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">the role requires.</text><line x1="505" y1="337" x2="920" y2="337" stroke="#e8e8ed" stroke-width="2"/><text x="527" y="190" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Your evidence</text><text x="527" y="231" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Select relevant experiences.</text>
<text x="527" y="265" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Identify your own actions</text>
<text x="527" y="299" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">and the actual outcomes.</text><path d="M 455 242 H 500" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 710 337 V 376 H 480 V 412" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 248 337 V 376 H 480" fill="none" stroke="#6e6e73" stroke-width="2.5"/><line x1="160" y1="599" x2="800" y2="599" stroke="#e8e8ed" stroke-width="2"/><text x="182" y="460" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Practice a matched answer</text><text x="182" y="501" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Use a prompt about the target capability.</text>
<text x="182" y="535" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Answer aloud; record or get feedback.</text>
<text x="182" y="569" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Revise the weakest part of the answer.</text><path d="M 160 510 H 70 V 371 H 248 V 342" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="45" y="653" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Example: collaboration requirement → a real handoff story.</text><text x="45" y="695" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Relevance and specific actions matter more than memorizing a script.</text><text x="40" y="771" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
