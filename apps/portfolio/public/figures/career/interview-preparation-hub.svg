<title id="title">Choose the next preparation task</title>
<desc id="desc">A preparation map routes four readiness gaps to an action: unclear role knowledge to employer research, missing examples to a story bank, unclear answers to aloud practice with feedback, and uncertain interview format to confirmation and matching practice. It recommends revisiting the weakest area after a mock interview.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="820" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Choose the next preparation task</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><line x1="185" y1="222" x2="775" y2="222" stroke="#e8e8ed" stroke-width="2"/><text x="480" y="193" font-size="29" fill="#1d1d1f" font-weight="600" text-anchor="middle">What is least ready for this interview?</text><line x1="40" y1="453" x2="470" y2="453" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="343" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">I cannot explain the role</text><text x="62" y="384" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Read the job description</text>
<text x="62" y="418" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">and research the employer.</text><line x1="490" y1="453" x2="920" y2="453" stroke="#e8e8ed" stroke-width="2"/><text x="512" y="343" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">I lack relevant examples</text><text x="512" y="384" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Build a story bank from</text>
<text x="512" y="418" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">real work and achievements.</text><line x1="40" y1="633" x2="470" y2="633" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="523" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">My answers are unclear</text><text x="62" y="564" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Practice aloud; ask for feedback</text>
<text x="62" y="598" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">on relevance and specificity.</text><line x1="490" y1="633" x2="920" y2="633" stroke="#e8e8ed" stroke-width="2"/><text x="512" y="523" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">The format is uncertain</text><text x="512" y="564" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Confirm the format and setup;</text>
<text x="512" y="598" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">choose matching practice.</text><text x="45" y="690" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Use the hub to resolve a gap, then rehearse the whole conversation.</text><text x="45" y="729" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Return to the least-ready area after each mock interview.</text><text x="40" y="791" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
