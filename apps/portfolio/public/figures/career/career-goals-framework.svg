<title id="title">Turn a career goal into observable work</title>
<desc id="desc">A four-level hierarchy connects career direction, a development goal, a practice assignment, and review evidence. An example moves from leading cross-team delivery to improving handoffs, coordinating a bounded project, and reviewing its plan and peer feedback. A return arrow shows that review can revise the goal.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="760" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Turn a career goal into observable work</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><path d="M 85 207 V 582" fill="none" stroke="#6e6e73" stroke-width="2.5"/><line x1="130" y1="240" x2="880" y2="240" stroke="#e8e8ed" stroke-width="2"/><text x="155" y="179" font-size="24" fill="#054a6b" font-weight="600" text-anchor="start">Career direction</text><text x="155" y="216" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">Lead cross-team delivery</text><circle cx="85" cy="190" r="19" fill="#1d1d1f"/><text x="85" y="198" font-size="22" fill="#ffffff" font-weight="600" text-anchor="middle">1</text><line x1="130" y1="362" x2="880" y2="362" stroke="#e8e8ed" stroke-width="2"/><text x="155" y="301" font-size="24" fill="#054a6b" font-weight="600" text-anchor="start">Development goal</text><text x="155" y="338" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">Improve planning and handoffs</text><circle cx="85" cy="312" r="19" fill="#1d1d1f"/><text x="85" y="320" font-size="22" fill="#ffffff" font-weight="600" text-anchor="middle">2</text><line x1="130" y1="484" x2="880" y2="484" stroke="#e8e8ed" stroke-width="2"/><text x="155" y="423" font-size="24" fill="#054a6b" font-weight="600" text-anchor="start">Practice assignment</text><text x="155" y="460" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">Coordinate a bounded project</text><circle cx="85" cy="434" r="19" fill="#1d1d1f"/><text x="85" y="442" font-size="22" fill="#ffffff" font-weight="600" text-anchor="middle">3</text><line x1="130" y1="606" x2="880" y2="606" stroke="#e8e8ed" stroke-width="2"/><text x="155" y="545" font-size="24" fill="#054a6b" font-weight="600" text-anchor="start">Review evidence</text><text x="155" y="582" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">Plan, peer feedback, delivery notes</text><circle cx="85" cy="556" r="19" fill="#1d1d1f"/><text x="85" y="564" font-size="22" fill="#ffffff" font-weight="600" text-anchor="middle">4</text><path d="M 902 585 V 188 H 883" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="470" y="657" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="middle">Use the review to revise the goal or assignment.</text><text x="40" y="731" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
