<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840" role="img" aria-labelledby="title desc">
<title id="title">Scan outside the organization</title><desc id="desc">Six external lenses surround a strategic decision: political, economic, social, technological, legal and environmental. Each contributes evidence about changes that may affect the decision; note timing and implications.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="840" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Scan outside the organization</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Six lenses on the environment around a strategic decision</tspan></text><text x="62" y="198" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="62" dy="0">Political</tspan></text><text x="62" y="238" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">Policy direction</tspan><tspan x="62" dy="32.5">and trade rules</tspan></text><text x="362" y="198" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="362" dy="0">Economic</tspan></text><text x="362" y="238" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="362" dy="0">Prices, rates</tspan><tspan x="362" dy="32.5">and spending</tspan></text><text x="662" y="198" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="662" dy="0">Social</tspan></text><text x="662" y="238" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="662" dy="0">Demographics</tspan><tspan x="662" dy="32.5">and expectations</tspan></text><text x="62" y="569" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="62" dy="0">Technological</tspan></text><text x="62" y="609" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">New capabilities</tspan><tspan x="62" dy="32.5">and substitutes</tspan></text><text x="362" y="569" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="362" dy="0">Legal</tspan></text><text x="362" y="609" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="362" dy="0">Duties, contracts</tspan><tspan x="362" dy="32.5">and constraints</tspan></text><text x="662" y="569" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="662" dy="0">Environmental</tspan></text><text x="662" y="609" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="662" dy="0">Resources, climate</tspan><tspan x="662" dy="32.5">and physical risks</tspan></text><path d="M180 300V343H480V364" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M480 300V364" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M780 300V343H480" fill="none" stroke="#6e6e73" stroke-width="3"/><path d="M180 531V496H480V476" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M480 531V476" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M780 531V496H480" fill="none" stroke="#6e6e73" stroke-width="3"/><rect x="214" y="376" width="532" height="90" rx="0" fill="#e8e8ed" stroke="#c7c7cc" stroke-width="2"/><text x="480" y="431" font-size="29" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan x="480" dy="0">What changes this decision?</tspan></text><text x="40" y="730" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Record the evidence, timing and implication of each factor.</tspan><tspan x="40" dy="32.5">A scan identifies questions; it does not predict the future.</tspan></text><path d="M40 778H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="812" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
