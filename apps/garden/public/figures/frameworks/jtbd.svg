<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840" role="img" aria-labelledby="title desc">
<title id="title">The same job has several dimensions</title><desc id="desc">For a hypothetical new team leader, functional progress is coordinating work, emotional progress is feeling prepared and social progress is appearing dependable. These dimensions combine into a job of leading with clarity and confidence.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="840" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">The same job has several dimensions</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">An illustrative interview synthesis, not a researched customer segment</tspan></text><rect x="40" y="145" width="880" height="105" rx="0" fill="#e8e8ed" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="183" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="60" dy="0">CIRCUMSTANCE</tspan></text><text x="60" y="224" font-size="29" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="60" dy="0">“I have just taken responsibility for a new team.”</tspan></text><text x="62" y="354" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="62" dy="0">Functional</tspan></text><text x="62" y="394" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">Coordinate the work</tspan><tspan x="62" dy="32.5">and clarify who</tspan><tspan x="62" dy="32.5">does what.</tspan></text><text x="362" y="354" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="362" dy="0">Emotional</tspan></text><text x="362" y="394" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="362" dy="0">Feel prepared</tspan><tspan x="362" dy="32.5">rather than</tspan><tspan x="362" dy="32.5">overwhelmed.</tspan></text><text x="662" y="354" font-size="28" font-weight="600" fill="#6b5803" text-anchor="start"><tspan x="662" dy="0">Social</tspan></text><text x="662" y="394" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="662" dy="0">Be seen as</tspan><tspan x="662" dy="32.5">a dependable</tspan><tspan x="662" dy="32.5">team leader.</tspan></text><path d="M480 250V285H180V304" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M480 285V304" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M480 285H780V304" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M180 508V555H780V508" fill="none" stroke="#6e6e73" stroke-width="3"/><path d="M480 555V584" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="597" width="760" height="145" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="122" y="635" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="122" dy="0">Progress to make</tspan></text><text x="122" y="675" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="122" dy="0">Help this team work together with clarity and confidence.</tspan><tspan x="122" dy="32.5">Compare solutions by the progress they enable.</tspan></text><path d="M40 778H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="812" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
