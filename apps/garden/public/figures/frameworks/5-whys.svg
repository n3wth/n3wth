<title id="title">A why can have more than one branch</title><desc id="desc">An illustrative late-report investigation branches into late data and late review. Each branch asks for records before suggesting an ownership or scheduling cause. Continue questioning where evidence is missing.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="790" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">A why can have more than one branch</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">An illustrative investigation, not a confirmed causal account</tspan></text><rect x="270" y="142" width="420" height="105" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="292" y="180" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="292" dy="0">Observed problem</tspan></text><text x="292" y="220" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="292" dy="0">A report arrived late</tspan></text><path d="M480 247V274H245V309" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M480 274H715V309" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="316" width="410" height="135" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="62" y="354" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="62" dy="0">Why? Data arrived late</tspan></text><text x="62" y="394" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">Check source timestamps.</tspan></text><rect x="510" y="316" width="410" height="135" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="532" y="354" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="532" dy="0">Why? Review started late</tspan></text><text x="532" y="394" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="532" dy="0">Check the handoff history.</tspan></text><path d="M245 451V490" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M715 451V490" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="500" width="410" height="137" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="62" y="538" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="62" dy="0">Possible system cause</tspan></text><text x="62" y="578" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">No owner for the feed.</tspan><tspan x="62" dy="32.5">Verify before changing it.</tspan></text><rect x="510" y="500" width="410" height="137" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="532" y="538" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="532" dy="0">Possible system cause</tspan></text><text x="532" y="578" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="532" dy="0">No review slot reserved.</tspan><tspan x="532" dy="32.5">Verify before changing it.</tspan></text><text x="40" y="689" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Ask again where the evidence still leaves a gap.</tspan></text><path d="M40 728H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="762" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
