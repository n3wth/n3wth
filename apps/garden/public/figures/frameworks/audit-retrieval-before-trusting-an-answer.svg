<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="870" viewBox="0 0 960 870" role="img" aria-labelledby="title desc">
<title id="title">One found set, two different denominators</title><desc id="desc">Three adjacent regions show returned irrelevant records, relevant returned records and relevant missing records. The returned set includes the first two; the relevant set includes the last two. Precision asks about relevance among returned records; recall asks about retrieval among relevant records.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="870" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">One found set, two different denominators</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">A conceptual set diagram; regions are not drawn to scale</tspan></text><text x="618" y="153" font-size="24" font-weight="600" fill="#0a5c22" text-anchor="middle"><tspan x="618" dy="0">ALL RELEVANT RECORDS</tspan></text><path d="M326 167V188H910V167" fill="none" stroke="#0a5c22" stroke-width="3"/><rect x="50" y="232" width="276" height="190" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><rect x="326" y="232" width="284" height="190" rx="0" fill="#e8e8ed" stroke="#c7c7cc" stroke-width="2"/><rect x="610" y="232" width="300" height="190" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="188" y="281" font-size="27" font-weight="600" fill="#6e6e73" text-anchor="middle"><tspan x="188" dy="0">Returned,</tspan><tspan x="188" dy="35.1">not relevant</tspan></text><text x="468" y="281" font-size="27" font-weight="600" fill="#0a5c22" text-anchor="middle"><tspan x="468" dy="0">Relevant</tspan><tspan x="468" dy="35.1">and returned</tspan></text><text x="760" y="281" font-size="27" font-weight="600" fill="#0071a4" text-anchor="middle"><tspan x="760" dy="0">Relevant,</tspan><tspan x="760" dy="35.1">not returned</tspan></text><text x="188" y="374" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="middle"><tspan x="188" dy="0">Extra material</tspan></text><text x="468" y="374" font-size="24" font-weight="400" fill="#0a5c22" text-anchor="middle"><tspan x="468" dy="0">Found support</tspan></text><text x="760" y="374" font-size="24" font-weight="400" fill="#0071a4" text-anchor="middle"><tspan x="760" dy="0">Missing support</tspan></text><path d="M50 454V474H610V454" fill="none" stroke="#0071a4" stroke-width="3"/><text x="330" y="514" font-size="24" font-weight="600" fill="#0071a4" text-anchor="middle"><tspan x="330" dy="0">ALL RETURNED RECORDS</tspan></text><text x="62" y="608" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="62" dy="0">Precision asks</tspan></text><text x="62" y="648" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">Of what came back,</tspan><tspan x="62" dy="32.5">how much was relevant?</tspan></text><text x="532" y="608" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="532" dy="0">Recall asks</tspan></text><text x="532" y="648" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="532" dy="0">Of what was relevant,</tspan><tspan x="532" dy="32.5">how much came back?</tspan></text><text x="40" y="771" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Neither measure checks whether the answer represents sources accurately.</tspan></text><path d="M40 808H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="842" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
