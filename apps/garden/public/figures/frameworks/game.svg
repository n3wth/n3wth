<title id="title">Turn an initiative into a testable claim</title><desc id="desc">A hypothetical setup experiment states a goal and hypothesis, changes one step, randomly assigns eligible users to current or revised setup, and compares predefined completion and error measures with uncertainty.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="900" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Turn an initiative into a testable claim</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">An illustrative experiment using this note’s Goals–Actions–Metrics–Experiments</tspan></text><rect x="40" y="144" width="880" height="122" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="62" y="182" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="62" dy="0">Goal: help users complete setup</tspan></text><text x="62" y="222" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">Hypothesis: a clearer first step helps users reach the core task.</tspan></text><text x="40" y="307" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">ACTION</tspan></text><text x="190" y="307" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="190" dy="0">Change one part of the setup experience.</tspan></text><rect x="265" y="350" width="430" height="68" rx="0" fill="#e8e8ed" stroke="#c7c7cc" stroke-width="2"/><text x="480" y="394" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan x="480" dy="0">Randomly assign eligible users</tspan></text><path d="M480 418V446H245V467" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M480 446H715V467" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="478" width="410" height="115" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="62" y="516" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">Control</tspan></text><text x="62" y="556" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">Current setup</tspan></text><rect x="510" y="478" width="410" height="115" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="532" y="516" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="532" dy="0">Treatment</tspan></text><text x="532" y="556" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="532" dy="0">Revised first step</tspan></text><path d="M245 593V624H715V593" fill="none" stroke="#6e6e73" stroke-width="3"/><path d="M480 624V650" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="661" width="880" height="132" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="62" y="699" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="62" dy="0">Metrics before launch</tspan></text><text x="62" y="739" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">Compare completion; also inspect errors and time to finish.</tspan><tspan x="62" dy="32.5">Define the analysis window and uncertainty before deciding.</tspan></text><path d="M40 838H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="872" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
