<title id="title">Support the barrier that is actually present</title><desc id="desc">Five rows distinguish awareness, desire, knowledge, ability and reinforcement. Sample statements identify each gap. Knowing what to do is distinguished from being able to do it, which may need practice and support.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="910" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Support the barrier that is actually present</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">An illustrative diagnostic worksheet using individual change outcomes</tspan></text><text x="40" y="155" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">OUTCOME</tspan></text><text x="260" y="155" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="260" dy="0">SIGN OF A GAP</tspan></text><text x="632" y="155" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="632" dy="0">POSSIBLE SUPPORT</tspan></text><path d="M40 181H920" fill="none" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="233" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="60" dy="0">Awareness</tspan></text><text x="260" y="220" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="260" dy="0">“Why is this changing?”</tspan></text><text x="632" y="220" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="632" dy="0">Explain the reason.</tspan></text><path d="M40 296H920" fill="none" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="348" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="60" dy="0">Desire</tspan></text><text x="260" y="335" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="260" dy="0">“Why would I join in?”</tspan></text><text x="632" y="335" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="632" dy="0">Discuss concerns</tspan><tspan x="632" dy="32.5">and motivation.</tspan></text><path d="M40 411H920" fill="none" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="463" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="60" dy="0">Knowledge</tspan></text><text x="260" y="450" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="260" dy="0">“What should I do?”</tspan></text><text x="632" y="450" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="632" dy="0">Teach the method.</tspan></text><rect x="40" y="526" width="880" height="99" rx="0" fill="#e8e8ed" stroke="none" stroke-width="2"/><path d="M40 526H920" fill="none" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="578" font-size="26" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="60" dy="0">Ability</tspan></text><text x="260" y="565" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="260" dy="0">“I know how, but</tspan><tspan x="260" dy="32.5">cannot do it yet.”</tspan></text><text x="632" y="565" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="632" dy="0">Practice with support.</tspan></text><path d="M40 641H920" fill="none" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="693" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="60" dy="0">Reinforcement</tspan></text><text x="260" y="680" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="260" dy="0">“We slipped back.”</tspan></text><text x="632" y="680" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="632" dy="0">Follow up and sustain</tspan><tspan x="632" dy="32.5">the new behavior.</tspan></text><text x="40" y="811" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Identify the earliest gap before choosing an intervention.</tspan></text><path d="M40 848H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="882" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
