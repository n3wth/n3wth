<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc">
<title id="title">Different stages need different signals</title><desc id="desc">Four rows pair acquire with qualified visits, activate with a first useful action, retain with use in a later period and monetize with a completed purchase. Events, eligible users and time windows must be defined; stages need not occur in fixed order.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="820" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Different stages need different signals</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">A measurement map for this note’s four lifecycle categories</tspan></text><text x="40" y="153" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">STAGE</tspan></text><text x="256" y="153" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="256" dy="0">QUESTION</tspan></text><text x="610" y="153" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="610" dy="0">EXAMPLE SIGNAL</tspan></text><path d="M40 176H920" fill="none" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="231" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="60" dy="0">Acquire</tspan></text><text x="256" y="230" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="256" dy="0">Can people find us?</tspan></text><text x="610" y="230" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="610" dy="0">Qualified visits</tspan></text><path d="M40 290H920" fill="none" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="345" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="60" dy="0">Activate</tspan></text><text x="256" y="344" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="256" dy="0">Do they reach value?</tspan></text><text x="610" y="344" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="610" dy="0">First useful action</tspan></text><path d="M40 404H920" fill="none" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="459" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="60" dy="0">Retain</tspan></text><text x="256" y="458" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="256" dy="0">Do they return?</tspan></text><text x="610" y="458" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="610" dy="0">Use in a later period</tspan></text><path d="M40 518H920" fill="none" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="573" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="60" dy="0">Monetize</tspan></text><text x="256" y="572" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="256" dy="0">Does value earn revenue?</tspan></text><text x="610" y="572" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="610" dy="0">Completed purchase</tspan></text><text x="40" y="690" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Define the event, eligible users and time window first.</tspan><tspan x="40" dy="33.800000000000004">These categories do not require a fixed journey order.</tspan></text><path d="M40 758H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="792" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
