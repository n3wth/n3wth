<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="850" viewBox="0 0 960 850" role="img" aria-labelledby="title desc">
<title id="title">Put your actions at the center</title><desc id="desc">A STAR answer describes an unclear handoff, personal responsibility for the process, specific actions to map handoffs and rehearse, and a documented agreement. The Action section is emphasized, and the result distinguishes an output from impact still to be verified.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="850" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Put your actions at the center</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">A hypothetical interview answer; use your own verifiable experience</tspan></text><rect x="40" y="144" width="880" height="602" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="65" y="188" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="65" dy="0">SITUATION</tspan></text><text x="285" y="188" font-size="28" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="285" dy="0">A release handoff was unclear.</tspan></text><path d="M65 222H895" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="65" y="267" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="65" dy="0">TASK</tspan></text><text x="285" y="267" font-size="28" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="285" dy="0">I owned the handoff process.</tspan></text><path d="M65 301H895" fill="none" stroke="#c7c7cc" stroke-width="3"/><rect x="61" y="324" width="836" height="239" rx="0" fill="#e8e8ed" stroke="#e8e8ed" stroke-width="2"/><text x="80" y="367" font-size="22" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="80" dy="0">ACTION</tspan></text><text x="285" y="367" font-size="28" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="285" dy="0">I mapped each handoff,</tspan><tspan x="285" dy="36.4">confirmed decision owners,</tspan><tspan x="285" dy="36.4">and ran a rehearsal with the team.</tspan></text><text x="285" y="506" font-size="25" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="285" dy="0">Make your contribution visible.</tspan></text><path d="M65 590H895" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="65" y="638" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="65" dy="0">RESULT</tspan></text><text x="285" y="638" font-size="27" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="285" dy="0">We documented an agreed process.</tspan><tspan x="285" dy="35.1">Next: verify how it works in practice.</tspan></text><path d="M40 788H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="822" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
