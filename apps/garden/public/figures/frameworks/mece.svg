<title id="title">A partition needs a boundary and a rule</title><desc id="desc">A bounded set of service requests is partitioned by current status into not started, in progress and closed. Two checks ask whether any request could fit two categories or none. Categories require explicit definitions for exceptions.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="835" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">A partition needs a boundary and a rule</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">An illustrative request-status classification</tspan></text><text x="40" y="154" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">DEFINE THE WHOLE FIRST</tspan></text><text x="40" y="197" font-size="28" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Example scope: every request received by a service.</tspan></text><rect x="40" y="232" width="880" height="242" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="60" y="270" font-size="25" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="60" dy="0">One classification rule: the request’s current status</tspan></text><rect x="62" y="301" width="276" height="147" rx="0" fill="#e8e8ed" stroke="#c7c7cc" stroke-width="2"/><rect x="338" y="301" width="275" height="147" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><rect x="613" y="301" width="285" height="147" rx="0" fill="#e8e8ed" stroke="#c7c7cc" stroke-width="2"/><text x="200" y="363" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan x="200" dy="0">Not started</tspan></text><text x="475" y="363" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan x="475" dy="0">In progress</tspan></text><text x="755" y="363" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan x="755" dy="0">Closed</tspan></text><text x="200" y="407" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="middle"><tspan x="200" dy="0">one place</tspan></text><text x="475" y="407" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="middle"><tspan x="475" dy="0">per request</tspan></text><text x="755" y="407" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="middle"><tspan x="755" dy="0">at a time</tspan></text><text x="62" y="564" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="62" dy="0">Test for overlap</tspan></text><text x="62" y="604" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">Could one request belong</tspan><tspan x="62" dy="32.5">in two categories at once?</tspan></text><text x="532" y="564" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="532" dy="0">Test for gaps</tspan></text><text x="532" y="604" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="532" dy="0">Could a request fit</tspan><tspan x="532" dy="32.5">none of the categories?</tspan></text><text x="40" y="733" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Define ambiguous and exceptional cases before counting.</tspan></text><path d="M40 773H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="807" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
