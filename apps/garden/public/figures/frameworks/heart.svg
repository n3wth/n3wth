<title id="title">A category becomes useful through a goal</title><desc id="desc">Three rows show Happiness, Retention and Task Success translated into goals, observable signals and candidate metrics. Confidence uses survey responses, retention uses an eligible cohort and task success uses eligible attempts. No results are plotted.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="860" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">A category becomes useful through a goal</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Illustrative examples of the Goals–Signals–Metrics process</tspan></text><text x="40" y="154" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">GOAL</tspan></text><text x="330" y="154" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="330" dy="0">SIGNAL</tspan></text><text x="620" y="154" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="620" dy="0">POSSIBLE METRIC</tspan></text><path d="M40 180H920" fill="none" stroke="#c7c7cc" stroke-width="2"/><text x="58" y="215" font-size="25" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="58" dy="0">Happiness</tspan></text><text x="58" y="257" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="58" dy="0">Users feel confident.</tspan></text><text x="330" y="257" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="330" dy="0">They report confidence</tspan><tspan x="330" dy="31.200000000000003">after the task.</tspan></text><text x="620" y="257" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="620" dy="0">Share choosing a</tspan><tspan x="620" dy="31.200000000000003">positive survey response.</tspan></text><path d="M40 353H920" fill="none" stroke="#c7c7cc" stroke-width="2"/><text x="58" y="388" font-size="25" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="58" dy="0">Retention</tspan></text><text x="58" y="430" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="58" dy="0">Users keep returning.</tspan></text><text x="330" y="430" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="330" dy="0">They return in a</tspan><tspan x="330" dy="31.200000000000003">defined later window.</tspan></text><text x="620" y="430" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="620" dy="0">Returning eligible users</tspan><tspan x="620" dy="31.200000000000003">÷ eligible cohort.</tspan></text><path d="M40 526H920" fill="none" stroke="#c7c7cc" stroke-width="2"/><text x="58" y="561" font-size="25" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="58" dy="0">Task success</tspan></text><text x="58" y="603" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="58" dy="0">Users finish the task.</tspan></text><text x="330" y="603" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="330" dy="0">They reach completion</tspan><tspan x="330" dy="31.200000000000003">without assistance.</tspan></text><text x="620" y="603" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="620" dy="0">Successful attempts</tspan><tspan x="620" dy="31.200000000000003">÷ all eligible attempts.</tspan></text><text x="40" y="745" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">These are examples from three HEART categories.</tspan><tspan x="40" dy="32.5">Choose goals first; define instruments and denominators next.</tspan></text><path d="M40 798H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="832" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
