  [fill="#6e6e73"] { fill: #6e6e73; }
  [fill="#f5f5f7"] { fill: #f5f5f7; }
  [fill="#1d1d1f"] { fill: #1d1d1f; }
  [stroke="#c7c7cc"] { stroke: rgba(8, 9, 11, 0.2); }
  [fill="#0071a4"] { fill: #054a6b; }
@media (prefers-color-scheme: dark) {
  [fill="#6e6e73"] { fill: #9aa0a8; }
  [fill="#f5f5f7"] { fill: #08090b; }
  [fill="#1d1d1f"] { fill: #f2f3f5; }
  [stroke="#c7c7cc"] { stroke: rgba(255, 255, 255, 0.17); }
  [fill="#0071a4"] { fill: #a9e5ff; }
