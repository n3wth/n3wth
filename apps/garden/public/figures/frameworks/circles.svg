<title id="title">Choose the need before the solution</title><desc id="desc">Seven rows show CIRCLES narrowing from context and users to a prioritized need, expanding to alternative solutions, and narrowing to a recommendation. Widths indicate conceptual breadth, not counts.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="895" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Choose the need before the solution</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">A conceptual scope map; widths indicate focus, not quantities</tspan></text><text x="40" y="149" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">SCOPE</tspan></text><text x="352" y="149" font-size="22" font-weight="600" fill="#6e6e73" text-anchor="start"><tspan x="352" dy="0">DECISION TO MAKE</tspan></text><rect x="40" y="175" width="250" height="59" rx="0" fill="#e8e8ed" stroke="#6e6e73" stroke-width="2"/><text x="57" y="214" font-size="24" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="57" dy="0">Comprehend</tspan></text><text x="352" y="215" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="352" dy="0">What problem and constraints?</tspan></text><rect x="40" y="258" width="220" height="59" rx="0" fill="#e8e8ed" stroke="#6e6e73" stroke-width="2"/><text x="57" y="297" font-size="24" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="57" dy="0">Identify</tspan></text><text x="352" y="298" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="352" dy="0">Which users are we serving?</tspan></text><rect x="40" y="341" width="190" height="59" rx="0" fill="#e8e8ed" stroke="#6e6e73" stroke-width="2"/><text x="57" y="380" font-size="24" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="57" dy="0">Report</tspan></text><text x="352" y="381" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="352" dy="0">Which needs do those users have?</tspan></text><rect x="40" y="424" width="125" height="59" rx="0" fill="#1d1d1f" stroke="#6e6e73" stroke-width="2"/><text x="57" y="463" font-size="24" font-weight="600" fill="#fff" text-anchor="start"><tspan x="57" dy="0">Cut</tspan></text><text x="352" y="464" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="352" dy="0">Which need takes priority?</tspan></text><rect x="40" y="507" width="250" height="59" rx="0" fill="#e8e8ed" stroke="#6e6e73" stroke-width="2"/><text x="57" y="546" font-size="24" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="57" dy="0">List</tspan></text><text x="352" y="547" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="352" dy="0">What different solutions could work?</tspan></text><rect x="40" y="590" width="180" height="59" rx="0" fill="#e8e8ed" stroke="#6e6e73" stroke-width="2"/><text x="57" y="629" font-size="24" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="57" dy="0">Evaluate</tspan></text><text x="352" y="630" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="352" dy="0">Which trade-offs are acceptable?</tspan></text><rect x="40" y="673" width="175" height="59" rx="0" fill="#1d1d1f" stroke="#6e6e73" stroke-width="2"/><text x="57" y="712" font-size="24" font-weight="600" fill="#fff" text-anchor="start"><tspan x="57" dy="0">Summarize</tspan></text><text x="352" y="713" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="352" dy="0">What do we recommend, and why?</tspan></text><text x="40" y="799" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Narrow the problem before expanding the solution space.</tspan></text><path d="M40 833H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="867" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
