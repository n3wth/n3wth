<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="815" viewBox="0 0 960 815" role="img" aria-labelledby="title desc">
<title id="title">The return visit starts in the current one</title><desc id="desc">A cycle links trigger, action, variable reward and investment. The investment stage stores preferences or work that can improve the next visit, linking back to the trigger. The center asks what value grows with use.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="815" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">The return visit starts in the current one</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Stored value connects investment to the next cycle</tspan></text><text x="62" y="190" font-size="28" font-weight="600" fill="#0071a4" text-anchor="start"><tspan x="62" dy="0">Trigger</tspan></text><text x="62" y="230" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">An external prompt, or</tspan><tspan x="62" dy="32.5">an internal need or routine.</tspan></text><text x="537" y="190" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="537" dy="0">Action</tspan></text><text x="537" y="230" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="537" dy="0">The simplest behavior</tspan><tspan x="537" dy="32.5">that seeks the reward.</tspan></text><text x="537" y="493" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="537" dy="0">Variable reward</tspan></text><text x="537" y="533" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="537" dy="0">Meet the need with</tspan><tspan x="537" dy="32.5">some element of variability.</tspan></text><text x="62" y="493" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="62" dy="0">Investment</tspan></text><text x="62" y="533" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="62" dy="0">Save preferences or work</tspan><tspan x="62" dy="32.5">that makes a return useful.</tspan></text><path d="M445 237H502" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M717 326V442" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M515 541H458" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M242 455V339" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="383" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle"><tspan x="480" dy="0">What value grows with use?</tspan></text><text x="40" y="692" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Investment should improve a later visit.</tspan><tspan x="40" dy="33.800000000000004">The loop describes a design idea, not a guaranteed habit.</tspan></text><path d="M40 753H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="787" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
