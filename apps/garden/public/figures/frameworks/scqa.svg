<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="865" viewBox="0 0 960 865" role="img" aria-labelledby="title desc">
<title id="title">Give the recommendation a reason to exist</title><desc id="desc">An annotated memo sets a weekly review process as the situation, between-meeting urgent requests as the complication, asks how to respond without interrupting everyone, and recommends a rotating triage owner with escalation rules.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="865" fill="#f5f5f7"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="59" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Give the recommendation a reason to exist</tspan></text><text x="40" y="98" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">An annotated, hypothetical decision memo</tspan></text><rect x="265" y="145" width="655" height="563" rx="0" fill="#fff" stroke="#c7c7cc" stroke-width="2"/><text x="40" y="196" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Situation</tspan></text><path d="M222 188H250" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><text x="295" y="191" font-size="27" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="295" dy="0">The team reviews requests</tspan><tspan x="295" dy="35.1">at a weekly meeting.</tspan></text><path d="M295 257H887" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="330" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Complication</tspan></text><path d="M222 322H250" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><text x="295" y="325" font-size="27" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="295" dy="0">Urgent requests now arrive</tspan><tspan x="295" dy="35.1">between those meetings.</tspan></text><path d="M295 391H887" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="464" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">Question</tspan></text><path d="M222 456H250" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><text x="295" y="459" font-size="27" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="295" dy="0">How can we respond promptly</tspan><tspan x="295" dy="35.1">without interrupting everyone?</tspan></text><path d="M295 525H887" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="598" font-size="27" font-weight="600" fill="#0a5c22" text-anchor="start"><tspan x="40" dy="0">Answer</tspan></text><path d="M222 590H250" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><text x="295" y="593" font-size="27" font-weight="400" fill="#1d1d1f" text-anchor="start"><tspan x="295" dy="0">Assign a rotating triage owner</tspan><tspan x="295" dy="35.1">and agree when to escalate.</tspan></text><text x="40" y="762" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="start"><tspan x="40" dy="0">The recommendation answers the question created by the change.</tspan></text><path d="M40 803H920" fill="none" stroke="#c7c7cc" stroke-width="3"/><text x="40" y="837" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start"><tspan x="40" dy="0">Conceptual illustration • not measured data</tspan></text></g></svg>
