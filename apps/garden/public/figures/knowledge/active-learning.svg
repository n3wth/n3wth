<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Make thinking visible</title>
<desc id="desc">Three successive learning activities: think alone to retrieve an answer, explain it with a partner to expose gaps, then share and receive feedback. A return arrow asks learners to revise their original answer.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e6e73"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect width="960" height="640" fill="#f5f5f7"/>
<text x="40" y="54" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Make thinking visible</text><text x="62" y="153" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Think</text><text x="62" y="192" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Attempt an answer</text><text x="62" y="228" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">before seeing others.</text><text x="62" y="264" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">What do I recall?</text><text x="367" y="153" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Pair</text><text x="367" y="192" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Explain your reasoning.</text><text x="367" y="228" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Compare approaches.</text><text x="367" y="264" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Where do we differ?</text><text x="672" y="153" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Share</text><text x="672" y="192" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Surface disagreements.</text><text x="672" y="228" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Check with feedback.</text><text x="672" y="264" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">What needs revision?</text><line x1="312" y1="218" x2="342" y2="218" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="617" y1="218" x2="647" y2="218" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 785 330 V 400 H 175 V 332" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="443" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle">Revise the answer, then explain what changed.</text><text x="480" y="501" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="middle">Participation is useful when it reveals the learner’s reasoning.</text>
<line x1="40" y1="577" x2="920" y2="577" stroke="#e8e8ed" stroke-width="2.5"/><text x="40" y="613" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual schematic · examples are illustrative</text>
</g>
</svg>
