 x="64" y="544" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">reinforce each other?</text><text x="367" y="469" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="start">Tension</text><text x="367" y="508" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Where do the books</text><text x="367" y="544" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">differ or qualify?</text><text x="672" y="469" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="start">Scope</text><text x="672" y="508" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Which people or</text><text x="672" y="544" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">situations are covered?</text><text x="480" y="638" font-size="25" font-weight="600" fill="#1d1d1f" text-anchor="middle">Write a bounded claim with source links and unresolved questions.</text>
