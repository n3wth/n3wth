<svg xmlns="http://www.w3.org/2000/svg" width="960" height="745" viewBox="0 0 960 745" role="img" aria-labelledby="title desc">
<title id="title">Compare books around one question</title>
<desc id="desc">A synthesis worksheet asks what sustains learning practice. Three book-note columns—Atomic Habits, Mindset and Grit—prompt the reader to locate relevant passages. A comparison area then asks about agreement, tensions and scope before forming a sourced claim.</desc>
