<title id="title">Diagnose the barrier before choosing a tactic</title>
<desc id="desc">For the example behavior of reading a page after breakfast, a diagnostic matrix asks whether capability, opportunity or motivation is limiting the behavior, then gives a matching change to test.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e6e73"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect width="960" height="668" fill="#f5f5f7"/>
<text x="40" y="54" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Diagnose the barrier before choosing a tactic</text><text x="40" y="106" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">Example target: read one page after breakfast.</text><rect x="40" y="140" width="880" height="60" rx="0" fill="#1d1d1f" stroke="#1d1d1f" stroke-width="1.5"/><text x="62" y="179" font-size="25" font-weight="600" fill="#ffffff" text-anchor="start">Condition</text><text x="298" y="179" font-size="25" font-weight="600" fill="#ffffff" text-anchor="start">Diagnostic question</text><text x="647" y="179" font-size="25" font-weight="600" fill="#ffffff" text-anchor="start">Change to test</text><rect x="40" y="200" width="880" height="115" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="62" y="243" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start">Capability</text><text x="298" y="242" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Can I understand</text><text x="298" y="278" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">the material?</text><text x="647" y="242" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Choose an accessible</text><text x="647" y="278" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">starting text.</text><rect x="40" y="315" width="880" height="115" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="62" y="358" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start">Opportunity</text><text x="298" y="357" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Is there time, space</text><text x="298" y="393" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">and access to the book?</text><text x="647" y="357" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Keep it beside the</text><text x="647" y="393" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">breakfast place.</text><rect x="40" y="430" width="880" height="115" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="62" y="473" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start">Motivation</text><text x="298" y="472" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Does reading matter to me?</text><text x="298" y="508" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">What routine takes over?</text><text x="647" y="472" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Name a reason; link</text><text x="647" y="508" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">to an existing cue.</text><text x="40" y="583" font-size="25" font-weight="600" fill="#1d1d1f" text-anchor="start">Check all three: more than one condition may need attention.</text>
<line x1="40" y1="605" x2="920" y2="605" stroke="#e8e8ed" stroke-width="2.5"/><text x="40" y="641" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual schematic · examples are illustrative</text>
</g>
</svg>
