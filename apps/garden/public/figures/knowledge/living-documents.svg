<title id="title">Make the revision visible</title>
<desc id="desc">An illustrative revision history moves from an open question to supporting evidence, then a counterexample and a scoped claim. A reader-facing note records current status, last revision, unresolved questions and a reason for the change.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e6e73"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect width="960" height="678" fill="#f5f5f7"/>
<text x="40" y="54" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Make the revision visible</text><line x1="86" y1="145" x2="86" y2="500" stroke="#0071a4" stroke-width="2.5"/><circle cx="86" cy="160" r="7" fill="#0071a4"/><circle cx="86" cy="265" r="7" fill="#0071a4"/><circle cx="86" cy="370" r="7" fill="#0071a4"/><circle cx="86" cy="475" r="7" fill="#0071a4"/><text x="120" y="154" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start">First draft</text><text x="120" y="190" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">State the question.</text><text x="120" y="259" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start">Evidence added</text><text x="120" y="295" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Link the supporting source.</text><text x="120" y="364" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start">Counterexample found</text><text x="120" y="400" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Record where the claim fails.</text><text x="120" y="469" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start">Claim narrowed</text><text x="120" y="505" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Keep the useful part and its limits.</text><rect x="567" y="131" width="353" height="407" rx="0" fill="#ffffff" stroke="#0071a4" stroke-width="2"/><text x="591" y="175" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start">Visible on the note</text><text x="591" y="230" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Status: growing</text><text x="591" y="279" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Last revised: [date]</text><text x="591" y="328" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Still unresolved: [gap]</text><line x1="591" y1="368" x2="896" y2="368" stroke="#e8e8ed" stroke-width="2.5"/><text x="591" y="411" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Change note:</text><text x="591" y="447" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">“Added a boundary after</text><text x="591" y="483" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">finding a counterexample.”</text><text x="40" y="586" font-size="25" font-weight="600" fill="#1d1d1f" text-anchor="start">A revised claim can become more useful by becoming narrower.</text>
<line x1="40" y1="615" x2="920" y2="615" stroke="#e8e8ed" stroke-width="2.5"/><text x="40" y="651" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual schematic · examples are illustrative</text>
</g>
</svg>
