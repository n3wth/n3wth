<svg xmlns="http://www.w3.org/2000/svg" width="960" height="705" viewBox="0 0 960 705" role="img" aria-labelledby="title desc">
<title id="title">Separate the encounters with the material</title>
<desc id="desc">Two illustrative schedules contain four practice encounters each. Massed encounters cluster in one sitting; spaced encounters occur over separate sessions. A lower strip shows attempting recall, checking the answer and adjusting the next review without assigning universal dates or retention percentages.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e6e73"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect width="960" height="705" fill="#f5f5f7"/>
<text x="40" y="54" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Separate the encounters with the material</text><text x="40" y="118" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start">Massed: one sitting</text><line x1="260" y1="174" x2="889" y2="174" stroke="#e8e8ed" stroke-width="2.5"/><circle cx="295" cy="174" r="16" fill="#6e6e73"/><circle cx="347" cy="174" r="16" fill="#6e6e73"/><circle cx="399" cy="174" r="16" fill="#6e6e73"/><circle cx="451" cy="174" r="16" fill="#6e6e73"/><text x="40" y="275" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start">Spaced: later sessions</text><line x1="260" y1="331" x2="889" y2="331" stroke="#e8e8ed" stroke-width="2.5"/><circle cx="295" cy="331" r="16" fill="#0071a4"/><circle cx="455" cy="331" r="16" fill="#0071a4"/><circle cx="649" cy="331" r="16" fill="#0071a4"/><circle cx="869" cy="331" r="16" fill="#0071a4"/><text x="262" y="383" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start">Session order →</text><rect x="40" y="432" width="880" height="129" rx="0" fill="#ffffff" stroke="#0071a4" stroke-width="2"/><text x="480" y="477" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="middle">At each review: attempt recall, then check.</text><text x="480" y="522" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="middle">Use the result to adjust the next encounter.</text><text x="40" y="595" font-size="24" font-weight="600" fill="#1d1d1f" text-anchor="start">Illustrative timing only; spacing is not a universal calendar.</text>
<line x1="40" y1="642" x2="920" y2="642" stroke="#e8e8ed" stroke-width="2.5"/><text x="40" y="678" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual schematic · examples are illustrative</text>
</g>
