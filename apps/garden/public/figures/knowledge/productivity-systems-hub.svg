<svg xmlns="http://www.w3.org/2000/svg" width="960" height="707" viewBox="0 0 960 707" role="img" aria-labelledby="title desc">
<title id="title">Give actions and knowledge distinct homes</title>
<desc id="desc">A captured item is clarified. An actionable item gets a next physical step and, when needed, a project outcome. Useful reference material enters connected notes. Regular review checks current commitments and resurfaces reference when work needs it.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e6e73"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect width="960" height="707" fill="#f5f5f7"/>
<text x="40" y="54" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Give actions and knowledge distinct homes</text><text x="312" y="149" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Capture and clarify</text><text x="312" y="188" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">What is this asking of me?</text><path d="M 480 218 V 254 H 247 V 303" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 480 254 H 712 V 303" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="143" y="254" width="211" height="36" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="151" y="281" font-size="22" font-weight="400" fill="#1d1d1f" text-anchor="start">Requires action</text><rect x="610" y="254" width="224" height="36" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="618" y="281" font-size="22" font-weight="400" fill="#1d1d1f" text-anchor="start">Useful reference</text><text x="62" y="345" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Action system</text><text x="62" y="384" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Name the next physical step.</text><text x="62" y="420" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Track the intended outcome.</text><text x="62" y="456" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Choose when or where to act.</text><text x="527" y="345" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Knowledge system</text><text x="527" y="384" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Keep the source and idea.</text><text x="527" y="420" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Link it to relevant concepts.</text><text x="527" y="456" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Retrieve it for later work.</text><line x1="247" y1="478" x2="247" y2="539" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="712" y1="478" x2="712" y2="539" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="543" width="880" height="77" rx="0" fill="#e8e8ed" stroke="#e8e8ed" stroke-width="1.5"/><text x="480" y="591" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="middle">Review commitments; reuse knowledge when it is needed.</text>
<line x1="40" y1="644" x2="920" y2="644" stroke="#e8e8ed" stroke-width="2.5"/><text x="40" y="680" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual schematic · examples are illustrative</text>
</g>
</svg>
