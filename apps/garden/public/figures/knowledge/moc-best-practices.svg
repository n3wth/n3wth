<svg xmlns="http://www.w3.org/2000/svg" width="960" height="661" viewBox="0 0 960 661" role="img" aria-labelledby="title desc">
<title id="title">Give each link a reason to be here</title>
<desc id="desc">An illustrative Learning MOC states a focus question, groups links under starting and improving headings, explains what each link helps with and includes a review cue. Side annotations identify scope, grouping, link purpose and maintenance.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e6e73"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect width="960" height="661" fill="#f5f5f7"/>
<text x="40" y="54" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Give each link a reason to be here</text><rect x="40" y="117" width="586" height="430" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="64" y="160" font-size="30" font-weight="600" fill="#1d1d1f" text-anchor="start">Learning MOC</text><text x="64" y="204" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Question: how do I improve a skill?</text><line x1="64" y1="228" x2="602" y2="228" stroke="#e8e8ed" stroke-width="2.5"/><text x="64" y="269" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="start">Start here</text><text x="64" y="310" font-size="24" font-weight="400" fill="#0071a4" text-anchor="start">Learning Plan — choose a target</text><text x="64" y="357" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="start">Improve through practice</text><text x="64" y="398" font-size="24" font-weight="400" fill="#0071a4" text-anchor="start">Deliberate Practice — work on a weakness</text><text x="64" y="439" font-size="24" font-weight="400" fill="#0071a4" text-anchor="start">Active Learning — explain your reasoning</text><text x="64" y="514" font-size="23" font-weight="400" fill="#6e6e73" text-anchor="start">Review cue: new notes or a changed goal</text><line x1="635" y1="194" x2="679" y2="194" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="694" y="183" font-size="23" font-weight="600" fill="#1d1d1f" text-anchor="start">Scope</text><text x="694" y="219" font-size="23" font-weight="600" fill="#1d1d1f" text-anchor="start">sets a boundary</text><line x1="635" y1="263" x2="679" y2="263" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="694" y="259" font-size="23" font-weight="600" fill="#1d1d1f" text-anchor="start">Headings</text><text x="694" y="295" font-size="23" font-weight="600" fill="#1d1d1f" text-anchor="start">show the route</text><line x1="635" y1="398" x2="679" y2="398" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="694" y="389" font-size="23" font-weight="600" fill="#1d1d1f" text-anchor="start">Link context</text><text x="694" y="425" font-size="23" font-weight="600" fill="#1d1d1f" text-anchor="start">explains the use</text><line x1="635" y1="511" x2="679" y2="511" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="694" y="497" font-size="23" font-weight="600" fill="#1d1d1f" text-anchor="start">Maintenance</text><text x="694" y="533" font-size="23" font-weight="600" fill="#1d1d1f" text-anchor="start">keeps it useful</text>
<line x1="40" y1="598" x2="920" y2="598" stroke="#e8e8ed" stroke-width="2.5"/><text x="40" y="634" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual schematic · examples are illustrative</text>
</g>
