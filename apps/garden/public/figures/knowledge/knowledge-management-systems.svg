<svg xmlns="http://www.w3.org/2000/svg" width="960" height="673" viewBox="0 0 960 673" role="img" aria-labelledby="title desc">
<title id="title">Design for the moment of reuse</title>
<desc id="desc">Search, topic maps and direct links provide three entry routes to a note that retains a claim, source and context. Reuse in a project reveals missing context, which feeds back into revising the stored note.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e6e73"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect width="960" height="673" fill="#f5f5f7"/>
<text x="40" y="54" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Design for the moment of reuse</text><text x="62" y="158" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Search</text><text x="62" y="197" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Known word or title</text><text x="378" y="158" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Topic map</text><text x="378" y="197" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">A useful overview</text><text x="695" y="158" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Direct link</text><text x="695" y="197" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">A related idea</text><path d="M 163 240 V 273 H 480 V 306" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="480" y1="240" x2="480" y2="306" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 796 240 V 273 H 480" fill="none" stroke="#6e6e73" stroke-width="2.5"/><rect x="240" y="310" width="480" height="123" rx="0" fill="#ffffff" stroke="#0071a4" stroke-width="2.5"/><text x="480" y="354" font-size="29" font-weight="600" fill="#1d1d1f" text-anchor="middle">Reusable note</text><text x="480" y="397" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="middle">Claim + source + enough context</text><line x1="480" y1="436" x2="480" y2="481" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="240" y="485" width="480" height="82" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="480" y="536" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle">Use it in an actual project</text><path d="M 723 529 H 863 V 370 H 726" fill="none" stroke="#6e6e73" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="770" y="447" font-size="22" font-weight="400" fill="#1d1d1f" text-anchor="start">Revise</text><text x="770" y="483" font-size="22" font-weight="400" fill="#1d1d1f" text-anchor="start">the note</text>
<line x1="40" y1="610" x2="920" y2="610" stroke="#e8e8ed" stroke-width="2.5"/><text x="40" y="646" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual schematic · examples are illustrative</text>
</g>
