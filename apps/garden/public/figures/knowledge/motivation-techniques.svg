<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title desc">
<title id="title">Match the support to the need</title>
<desc id="desc">Three supports surround sustained engagement: autonomy means choosing a personally meaningful reason, competence means a workable challenge and useful feedback, and relatedness means caring connection. These are interacting needs rather than ranked tactics.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e6e73"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect width="960" height="690" fill="#f5f5f7"/>
<text x="40" y="54" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Match the support to the need</text><text x="297" y="152" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Autonomy</text><text x="297" y="191" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Choose a reason you endorse.</text><text x="297" y="227" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Keep a meaningful choice.</text><text x="62" y="425" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Competence</text><text x="62" y="464" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Use a workable challenge.</text><text x="62" y="500" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Get informative feedback.</text><text x="547" y="425" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Relatedness</text><text x="547" y="464" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Work with someone who cares.</text><text x="547" y="500" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Offer and receive support.</text><line x1="480" y1="248" x2="480" y2="290" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="279" y1="385" x2="362" y2="347" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="683" y1="385" x2="597" y2="347" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="289" y="291" width="382" height="74" rx="0" fill="#e8e8ed" stroke="#e8e8ed" stroke-width="1.5"/><text x="480" y="338" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="middle">Sustained engagement</text><text x="480" y="588" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="middle">Ask what is missing before adding another reward.</text>
<line x1="40" y1="627" x2="920" y2="627" stroke="#e8e8ed" stroke-width="2.5"/><text x="40" y="663" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual schematic · examples are illustrative</text>
</g>
</svg>
