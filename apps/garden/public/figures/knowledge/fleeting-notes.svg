<svg xmlns="http://www.w3.org/2000/svg" width="960" height="707" viewBox="0 0 960 707" role="img" aria-labelledby="title desc">
<title id="title">Give captured thoughts a next destination</title>
<desc id="desc">A captured thought enters a writing inbox. On review, an idea worth developing becomes a self-contained linked note. An unclear idea stays with a specific question; an unhelpful one can be archived or discarded.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e6e73"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect width="960" height="707" fill="#f5f5f7"/>
<text x="40" y="54" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Give captured thoughts a next destination</text><text x="312" y="146" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Capture quickly</text><text x="312" y="185" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Keep a separate inbox.</text><line x1="480" y1="214" x2="480" y2="253" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="290" y="255" width="380" height="87" rx="0" fill="#e8e8ed" stroke="#6e6e73" stroke-width="1.5"/><text x="480" y="308" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="middle">Worth developing?</text><path d="M 290 299 H 185 V 409" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="480" y1="344" x2="480" y2="409" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 670 299 H 775 V 409" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="96" y="338" width="55" height="36" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="104" y="365" font-size="22" font-weight="400" fill="#1d1d1f" text-anchor="start">Yes</text><rect x="386" y="352" width="185" height="36" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="394" y="379" font-size="22" font-weight="400" fill="#1d1d1f" text-anchor="start">Not clear yet</text><rect x="746" y="338" width="42" height="36" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="754" y="365" font-size="22" font-weight="400" fill="#1d1d1f" text-anchor="start">No</text><text x="62" y="451" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Develop</text><text x="62" y="490" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Write the idea clearly.</text><text x="62" y="526" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Link it into context.</text><text x="372" y="451" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Revisit</text><text x="372" y="490" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Leave a useful prompt.</text><text x="372" y="526" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Review it again.</text><text x="682" y="451" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Let it go</text><text x="682" y="490" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Archive or discard</text><text x="682" y="526" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">what adds no value.</text><text x="40" y="614" font-size="25" font-weight="600" fill="#1d1d1f" text-anchor="start">An inbox works only when a review practice keeps it moving.</text>
<line x1="40" y1="644" x2="920" y2="644" stroke="#e8e8ed" stroke-width="2.5"/><text x="40" y="680" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual schematic · examples are illustrative</text>
</g>
</svg>
