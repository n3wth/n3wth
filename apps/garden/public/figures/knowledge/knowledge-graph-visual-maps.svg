"start">guides</text><rect x="544" y="309" width="314" height="66" rx="0" fill="#f5f5f7" stroke="#6e6e73" stroke-width="1.5"/><text x="701" y="352" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="middle">Practice attempt</text><line x1="701" y1="378" x2="701" y2="444" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="706" y="389" width="120" height="36" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="714" y="416" font-size="22" font-weight="400" fill="#1d1d1f" text-anchor="start">produces</text><rect x="544" y="447" width="314" height="66" rx="0" fill="#f5f5f7" stroke="#6e6e73" stroke-width="1.5"/><text x="701" y="490" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="middle">Feedback</text><path d="M 542 480 H 516 V 209 H 540" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/>
