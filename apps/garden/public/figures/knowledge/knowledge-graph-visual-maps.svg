<title id="title">Use an overview to choose a local question</title>
<desc id="desc">An illustrative overview links the Learning, Knowledge and Work domains. A magnified local map focuses on learning: a target guides practice, practice produces feedback, and feedback revises the target. It is not an audit of the actual garden graph.</desc>
