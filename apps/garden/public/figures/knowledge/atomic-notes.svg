<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">One idea, enough context</title>
<desc id="desc">An illustrative note contains a specific title, one complete claim, a boundary condition and a relationship link. Annotations distinguish a self-contained idea from an isolated fragment.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e6e73"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect width="960" height="650" fill="#f5f5f7"/>
<text x="40" y="54" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">One idea, enough context</text><rect x="40" y="118" width="565" height="410" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="68" y="161" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">A note must carry its own context</text><line x1="68" y1="185" x2="575" y2="185" stroke="#e8e8ed" stroke-width="2.5"/><text x="68" y="229" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">A single idea can be reused when</text><text x="68" y="265" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">its meaning survives outside the</text><text x="68" y="301" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">book or project that prompted it.</text><text x="68" y="358" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">Keep the explanation and its limits</text><text x="68" y="394" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">together; split unrelated claims.</text><text x="68" y="474" font-size="24" font-weight="400" fill="#0071a4" text-anchor="start">Related: naming meaningful links</text><line x1="615" y1="151" x2="660" y2="151" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="677" y="147" font-size="23" font-weight="600" fill="#1d1d1f" text-anchor="start">Specific title</text><text x="677" y="183" font-size="23" font-weight="600" fill="#1d1d1f" text-anchor="start">names the claim</text><line x1="615" y1="260" x2="660" y2="260" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="677" y="252" font-size="23" font-weight="600" fill="#1d1d1f" text-anchor="start">Complete idea</text><text x="677" y="288" font-size="23" font-weight="600" fill="#1d1d1f" text-anchor="start">stands alone</text><line x1="615" y1="370" x2="660" y2="370" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="677" y="363" font-size="23" font-weight="600" fill="#1d1d1f" text-anchor="start">Boundary</text><text x="677" y="399" font-size="23" font-weight="600" fill="#1d1d1f" text-anchor="start">keeps nuance</text><line x1="615" y1="478" x2="660" y2="478" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="677" y="470" font-size="23" font-weight="600" fill="#1d1d1f" text-anchor="start">Connection</text><text x="677" y="506" font-size="23" font-weight="600" fill="#1d1d1f" text-anchor="start">enables reuse</text>
<line x1="40" y1="587" x2="920" y2="587" stroke="#e8e8ed" stroke-width="2.5"/><text x="40" y="623" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual schematic · examples are illustrative</text>
</g>
</svg>
