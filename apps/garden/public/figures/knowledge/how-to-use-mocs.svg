<svg xmlns="http://www.w3.org/2000/svg" width="960" height="691" viewBox="0 0 960 691" role="img" aria-labelledby="title desc">
<title id="title">A hub is an entry point, not a container</title>
<desc id="desc">A home note links to Learning and Writing maps of content. Both maps point to the same feedback note, while each also links to a note relevant to its own purpose. Notes can be reached through more than one map.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e6e73"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect width="960" height="691" fill="#f5f5f7"/>
<text x="40" y="54" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">A hub is an entry point, not a container</text><rect x="350" y="108" width="260" height="73" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="480" y="154" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="middle">Home note</text><path d="M 480 183 V 215 H 255 V 254" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 480 215 H 705 V 254" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="259" width="370" height="90" rx="0" fill="#ffffff" stroke="#0071a4" stroke-width="2.5"/><text x="255" y="315" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="middle">Learning MOC</text><rect x="520" y="259" width="370" height="90" rx="0" fill="#ffffff" stroke="#0071a4" stroke-width="2.5"/><text x="705" y="315" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="middle">Writing MOC</text><line x1="160" y1="350" x2="160" y2="444" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="353" y1="350" x2="480" y2="444" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="600" y1="350" x2="485" y2="444" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="800" y1="350" x2="800" y2="444" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="447" width="247" height="90" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="164" y="503" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="middle">Practice note</text><rect x="359" y="447" width="247" height="90" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="483" y="503" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="middle">Feedback note</text><rect x="673" y="447" width="247" height="90" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="797" y="503" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="middle">Revision note</text><text x="480" y="581" font-size="25" font-weight="600" fill="#1d1d1f" text-anchor="middle">One note can belong to several useful routes.</text>
