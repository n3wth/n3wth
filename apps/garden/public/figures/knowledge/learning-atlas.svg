<svg xmlns="http://www.w3.org/2000/svg" width="960" height="683" viewBox="0 0 960 683" role="img" aria-labelledby="title desc">
<title id="title">Choose a route from what you already know</title>
<desc id="desc">Three routes into a personal knowledge base depend on the starting cue: a known phrase suggests search, a topic suggests a map of content, and a current idea suggests a contextual link. Each route includes a check before using the result.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e6e73"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect width="960" height="683" fill="#f5f5f7"/>
<text x="40" y="54" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Choose a route from what you already know</text><text x="40" y="110" font-size="25" font-weight="600" fill="#6e6e73" text-anchor="start">Starting cue</text><text x="357" y="110" font-size="25" font-weight="600" fill="#6e6e73" text-anchor="start">Route into the atlas</text><text x="681" y="110" font-size="25" font-weight="600" fill="#6e6e73" text-anchor="start">Check on arrival</text><rect x="40" y="144" width="880" height="127" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="61" y="188" font-size="25" font-weight="600" fill="#1d1d1f" text-anchor="start">“I remember a phrase.”</text><text x="357" y="190" font-size="25" font-weight="600" fill="#0071a4" text-anchor="start">Search names and text</text><text x="681" y="187" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Does this match</text><text x="681" y="223" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">the intended meaning?</text><rect x="40" y="303" width="880" height="127" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="61" y="347" font-size="25" font-weight="600" fill="#1d1d1f" text-anchor="start">“I know the topic.”</text><text x="357" y="349" font-size="25" font-weight="600" fill="#0071a4" text-anchor="start">Browse a topic MOC</text><text x="681" y="346" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Is this the right</text><text x="681" y="382" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">part of the topic?</text><rect x="40" y="462" width="880" height="127" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><text x="61" y="506" font-size="25" font-weight="600" fill="#1d1d1f" text-anchor="start">“I have a related idea.”</text><text x="357" y="508" font-size="25" font-weight="600" fill="#0071a4" text-anchor="start">Follow a contextual link</text><text x="681" y="505" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Why are these</text><text x="681" y="541" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">ideas connected?</text>
<line x1="40" y1="620" x2="920" y2="620" stroke="#e8e8ed" stroke-width="2.5"/><text x="40" y="656" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual schematic · examples are illustrative</text>
