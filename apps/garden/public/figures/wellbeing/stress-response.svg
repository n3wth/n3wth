<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="785" viewBox="0 0 960 785" role="img" aria-labelledby="title desc">
<title id="title">Use signals to choose support</title>
<desc id="desc">A feedback map links noticing stress signals to trying relaxation, movement, sleep routines or social support, then journaling what helped. A separate branch directs persistent or disruptive symptoms toward professional support.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="785" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="40" y="56" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Use signals to choose support</text>
<path d="M 40 82 L 920 82" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="128" font-size="24" font-weight="600" fill="#6e6e73" text-anchor="start">NOTICE</text><text x="502" y="128" font-size="24" font-weight="600" fill="#6e6e73" text-anchor="start">CHOOSE A RESPONSE</text><text x="64" y="192" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Tension or body discomfort</text>
<text x="64" y="226" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Racing or worried thoughts</text>
<text x="64" y="260" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Disrupted sleep</text>
<text x="64" y="294" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Feeling overwhelmed</text><path d="M 395 247 L 476 247" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><text x="528" y="192" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Try a relaxation practice.</text>
<text x="528" y="226" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Move in a way that fits you.</text>
<text x="528" y="260" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Keep a sleep routine.</text>
<text x="528" y="294" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Contact someone supportive.</text><path d="M 700 342 L 700 402" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><text x="524" y="459" font-size="28" font-weight="600" fill="#054a6b" text-anchor="start">Review what helped</text><text x="524" y="501" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Note trigger, response</text>
<text x="524" y="536" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">and how you felt.</text><path d="M502 490H205V358" fill="none" stroke="#6e6e73" stroke-width="3"/><text x="62" y="645" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start">When coping is not enough</text><text x="62" y="687" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Persistent or disruptive symptoms: seek professional support.</text>
<path d="M 40 728 L 920 728" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="762" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual diagram • not measured data</text>
</g>
</svg>
