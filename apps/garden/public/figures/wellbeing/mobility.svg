<text x="40" y="56" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Movement has complementary demands</text>
<path d="M 40 82 L 920 82" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="126" font-size="27" font-weight="400" fill="#1d1d1f" text-anchor="start">Flexibility is one part of moving well</text><circle cx="480" cy="330" r="112" fill="#ffffff" stroke="#6e6e73" stroke-width="3"/><text x="480" y="311" font-size="30" font-weight="600" fill="#1d1d1f" text-anchor="middle">Everyday</text>
<text x="480" y="351" font-size="30" font-weight="600" fill="#1d1d1f" text-anchor="middle">movement</text><path d="M 376 287 L 273 217" fill="none" stroke="#6e6e73" stroke-width="3"/><path d="M 584 287 L 687 217" fill="none" stroke="#6e6e73" stroke-width="3"/><path d="M 376 373 L 273 473" fill="none" stroke="#6e6e73" stroke-width="3"/><path d="M 584 373 L 687 473" fill="none" stroke="#6e6e73" stroke-width="3"/><text x="62" y="201" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start">Flexibility</text><text x="62" y="241" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Stretch muscles.</text><text x="682" y="201" font-size="28" font-weight="600" fill="#054a6b" text-anchor="start">Strength</text><text x="682" y="241" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Work against load.</text><text x="62" y="466" font-size="28" font-weight="600" fill="#054a6b" text-anchor="start">Balance</text><text x="62" y="506" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Practice stability.</text><text x="682" y="466" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start">Endurance</text><text x="682" y="506" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Keep moving longer.</text>
