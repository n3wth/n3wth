<title id="title">Movement has complementary demands</title>
<desc id="desc">Four branches connect flexibility, strength, balance and endurance to everyday movement. Flexibility stretches muscles, strength works against resistance, balance practices stability and endurance sustains activity.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#6e6e73"/></marker></defs>
