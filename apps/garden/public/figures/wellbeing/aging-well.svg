<text x="40" y="56" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Support the life you want to keep living</text>
<path d="M 40 82 L 920 82" fill="none" stroke="#6e6e73" stroke-width="3"/>
<circle cx="480" cy="354" r="124" fill="#ffffff" stroke="#1d1d1f" stroke-width="3"/><text x="480" y="334" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="middle">Quality of life</text>
<text x="480" y="372" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="middle">and independence</text><path d="M 389 269 L 307 197" fill="none" stroke="#6e6e73" stroke-width="3"/><path d="M 571 269 L 614 241" fill="none" stroke="#6e6e73" stroke-width="3"/><path d="M 363 395 L 258 479" fill="none" stroke="#6e6e73" stroke-width="3"/><path d="M 597 395 L 699 479" fill="none" stroke="#6e6e73" stroke-width="3"/><text x="62" y="162" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start">Physical health</text><text x="62" y="204" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Movement, food</text>
<text x="62" y="239" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">and sleep.</text><text x="625" y="162" font-size="28" font-weight="600" fill="#054a6b" text-anchor="start">Connection</text><text x="625" y="204" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Relationships</text>
<text x="625" y="239" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">and community.</text><text x="62" y="526" font-size="28" font-weight="600" fill="#054a6b" text-anchor="start">Care</text><text x="62" y="568" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Regular check-ups;</text>
