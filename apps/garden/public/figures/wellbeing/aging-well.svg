<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc">
<title id="title">Support the life you want to keep living</title>
<desc id="desc">Four connected domains surround quality of life and independence: physical health through movement, food and sleep; social connection; regular care; and meaningful engagement and learning. The network shows complementary domains, not measured causal effects.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#6e6e73"/></marker></defs>
