<text x="625" y="603" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">and learning.</text><text x="480" y="704" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="middle">Adapt choices to changing needs and abilities.</text>
