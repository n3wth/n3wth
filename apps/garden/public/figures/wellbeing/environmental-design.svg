<title id="title">Design for cleaner indoor air</title>
<desc id="desc">Conceptual room plan shows three indoor-air actions: remove or reduce pollution sources, ventilate appropriately, and supplement with air filtration. A crossed source symbol is distinct from a filter and an incoming-air opening.</desc>
