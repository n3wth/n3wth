<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="765" viewBox="0 0 960 765" role="img" aria-labelledby="title desc">
<title id="title">Two routes to a weekly aerobic target</title>
<desc id="desc">Bars show CDC adult aerobic recommendations in minutes per week: 150 moderate or 75 vigorous. A separate panel adds muscle strengthening on at least two days. Aerobic amounts are alternatives or can be combined.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="765" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="40" y="56" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Two routes to a weekly aerobic target</text>
<path d="M 40 82 L 920 82" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="130" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Alternative aerobic targets</text><text x="40" y="205" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start">Moderate</text><rect x="235" y="169" width="600" height="66" rx="0" fill="#054a6b" stroke="#054a6b" stroke-width="2"/><text x="810" y="212" font-size="28" font-weight="600" fill="#ffffff" text-anchor="end">150 min/week</text><text x="40" y="300" font-size="27" font-weight="600" fill="#1d1d1f" text-anchor="start">Vigorous</text><rect x="235" y="264" width="300" height="66" rx="0" fill="#0a5c22" stroke="#0a5c22" stroke-width="2"/><text x="555" y="309" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">75 min/week</text><path d="M 235 353 L 835 353" fill="none" stroke="#6e6e73" stroke-width="3"/><path d="M 235 346 L 235 361" fill="none" stroke="#6e6e73" stroke-width="3"/><text x="235" y="392" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="middle">0</text><path d="M 535 346 L 535 361" fill="none" stroke="#6e6e73" stroke-width="3"/><text x="535" y="392" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="middle">75</text><path d="M 835 346 L 835 361" fill="none" stroke="#6e6e73" stroke-width="3"/><text x="835" y="392" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="middle">150</text><text x="535" y="432" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="middle">Minutes per week</text><text x="62" y="511" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">PLUS muscle strengthening</text><text x="62" y="555" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">At least 2 days/week, covering major muscle groups.</text><text x="40" y="645" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Or combine moderate and vigorous activity at equivalent effort.</text>
<text x="40" y="679" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Spread activity across the week; choose activities that fit your ability.</text>
<path d="M 40 708 L 920 708" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="742" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Guideline amounts • not measured effects • source: CDC</text>
</g>
</svg>
