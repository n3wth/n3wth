<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
<title id="title">More challenge has several controls</title>
<desc id="desc">Four training controls show load, volume, frequency and movement intent. A review panel asks the reader to choose sustainable changes and monitor effort, technique and recovery; it does not prescribe increasing every control.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="760" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="40" y="56" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">More challenge has several controls</text>
<path d="M 40 82 L 920 82" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="126" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">Progression can use different training variables</text><text x="62" y="191" font-size="29" font-weight="600" fill="#054a6b" text-anchor="start">Load</text><text x="62" y="234" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">How much resistance</text>
<text x="62" y="270" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">you work against.</text><text x="527" y="191" font-size="29" font-weight="600" fill="#054a6b" text-anchor="start">Volume</text><text x="527" y="234" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">How much total work</text>
<text x="527" y="270" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">you do.</text><text x="62" y="399" font-size="29" font-weight="600" fill="#0a5c22" text-anchor="start">Frequency</text><text x="62" y="442" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">How often you repeat</text>
<text x="62" y="478" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">the training.</text><text x="527" y="399" font-size="29" font-weight="600" fill="#0a5c22" text-anchor="start">Movement intent</text><text x="527" y="442" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">How you execute the</text>
<text x="527" y="478" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">movement for your goal.</text><text x="480" y="608" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="middle">Choose changes you can sustain</text><text x="480" y="647" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="middle">Review effort, technique and recovery.</text>
<path d="M 40 703 L 920 703" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="737" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual diagram • not measured data</text>
</g>
</svg>
