<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
<title id="title">Use effort and speech together</title>
<desc id="desc">A subjective 0-to-10 effort scale highlights 5–6 as moderate and 7–8 as vigorous. Moderate activity permits talking but not singing; vigorous activity allows only a few words before pausing for breath.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="680" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="40" y="56" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Use effort and speech together</text>
<path d="M 40 82 L 920 82" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="126" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">Perceived effort: 0 = sitting, 10 = hardest possible</text><rect x="43" y="157" width="75" height="74" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/><text x="80.5" y="204" font-size="29" font-weight="600" fill="#1d1d1f" text-anchor="middle">0</text><rect x="122" y="157" width="75" height="74" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/><text x="159.5" y="204" font-size="29" font-weight="600" fill="#1d1d1f" text-anchor="middle">1</text><rect x="201" y="157" width="75" height="74" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/><text x="238.5" y="204" font-size="29" font-weight="600" fill="#1d1d1f" text-anchor="middle">2</text><rect x="280" y="157" width="75" height="74" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/><text x="317.5" y="204" font-size="29" font-weight="600" fill="#1d1d1f" text-anchor="middle">3</text><rect x="359" y="157" width="75" height="74" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/><text x="396.5" y="204" font-size="29" font-weight="600" fill="#1d1d1f" text-anchor="middle">4</text><rect x="438" y="157" width="75" height="74" rx="0" fill="#054a6b" stroke="#054a6b" stroke-width="2"/><text x="475.5" y="204" font-size="29" font-weight="600" fill="#ffffff" text-anchor="middle">5</text><rect x="517" y="157" width="75" height="74" rx="0" fill="#054a6b" stroke="#054a6b" stroke-width="2"/><text x="554.5" y="204" font-size="29" font-weight="600" fill="#ffffff" text-anchor="middle">6</text><rect x="596" y="157" width="75" height="74" rx="0" fill="#0a5c22" stroke="#0a5c22" stroke-width="2"/><text x="633.5" y="204" font-size="29" font-weight="600" fill="#ffffff" text-anchor="middle">7</text><rect x="675" y="157" width="75" height="74" rx="0" fill="#0a5c22" stroke="#0a5c22" stroke-width="2"/><text x="712.5" y="204" font-size="29" font-weight="600" fill="#ffffff" text-anchor="middle">8</text><rect x="754" y="157" width="75" height="74" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/><text x="791.5" y="204" font-size="29" font-weight="600" fill="#1d1d1f" text-anchor="middle">9</text><rect x="833" y="157" width="75" height="74" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/><text x="870.5" y="204" font-size="29" font-weight="600" fill="#1d1d1f" text-anchor="middle">10</text><text x="62" y="330" font-size="28" font-weight="600" fill="#054a6b" text-anchor="start">Moderate: 5–6</text><text x="62" y="372" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">You can talk,</text>
<text x="62" y="407" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">but cannot sing.</text>
<text x="62" y="442" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Breathing is harder.</text><text x="527" y="330" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="start">Vigorous: 7–8</text><text x="527" y="372" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Only a few words</text>
<text x="527" y="407" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">before a pause</text>
<text x="527" y="442" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">to catch your breath.</text><text x="40" y="550" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">This is a subjective intensity guide, not a heart-rate conversion.</text>
<text x="40" y="585" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">The same activity can feel different to different people.</text>
<path d="M 40 623 L 920 623" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="657" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual diagram • not measured data</text>
</g>
</svg>
