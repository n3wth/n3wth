<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
<title id="title">The root zone needs air and water</title>
<desc id="desc">A conceptual pot section shows roots among particles and pore spaces, with callouts for air, retained water, nutrient supply and root support. Particle sizes and water distribution are illustrative.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="680" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="40" y="56" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">The root zone needs air and water</text>
<path d="M 40 82 L 920 82" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="124" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">A mix must serve three functions at once</text><path d="M170 195L440 195L403 505L207 505Z" fill="#ffffff" stroke="#1d1d1f" stroke-width="3"/><path d="M176 245H434L403 505H207Z" fill="#e8e8ed" stroke="#6e6e73" stroke-width="2"/><circle cx="225" cy="290" r="21" fill="#f5f5f7" stroke="#6e6e73" stroke-width="3"/><circle cx="303" cy="285" r="28" fill="#f5f5f7" stroke="#6e6e73" stroke-width="3"/><circle cx="380" cy="300" r="22" fill="#f5f5f7" stroke="#6e6e73" stroke-width="3"/><circle cx="251" cy="364" r="29" fill="#f5f5f7" stroke="#6e6e73" stroke-width="3"/><circle cx="344" cy="375" r="21" fill="#f5f5f7" stroke="#6e6e73" stroke-width="3"/><circle cx="248" cy="450" r="23" fill="#f5f5f7" stroke="#6e6e73" stroke-width="3"/><circle cx="357" cy="460" r="27" fill="#f5f5f7" stroke="#6e6e73" stroke-width="3"/><path d="M293 225 C291 286 275 320 294 370 S312 430 298 470" fill="none" stroke="#0a5c22" stroke-width="5"/><path d="M293 338L260 329M301 393L337 413" fill="none" stroke="#0a5c22" stroke-width="4"/><circle cx="305" cy="331" r="11" fill="#0071a4" stroke="#0071a4" stroke-width="3"/><circle cx="284" cy="428" r="9" fill="#0071a4" stroke="#0071a4" stroke-width="3"/><path d="M 408 301 L 508 206" fill="none" stroke="#6e6e73" stroke-width="3"/><text x="529" y="207" font-size="30" font-weight="600" fill="#054a6b" text-anchor="start">Air</text><text x="529" y="245" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Pore spaces allow oxygen</text>
<text x="529" y="280" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">to reach roots.</text><path d="M 305 331 L 508 333" fill="none" stroke="#6e6e73" stroke-width="3"/><text x="529" y="333" font-size="30" font-weight="600" fill="#054a6b" text-anchor="start">Water</text><text x="529" y="371" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">The medium holds moisture</text>
<text x="529" y="406" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">between waterings.</text><path d="M 390 451 L 508 459" fill="none" stroke="#6e6e73" stroke-width="3"/><text x="529" y="459" font-size="30" font-weight="600" fill="#054a6b" text-anchor="start">Nutrients + support</text><text x="529" y="497" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">The medium anchors roots;</text>
<text x="529" y="532" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">nutrient supply also matters.</text><text x="40" y="598" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Judge the whole mix in use, not a single ingredient ratio.</text>
<path d="M 40 623 L 920 623" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="657" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual diagram • not measured data</text>
</g>
</svg>
