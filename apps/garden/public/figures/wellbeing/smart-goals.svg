<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="770" viewBox="0 0 960 770" role="img" aria-labelledby="title desc">
<title id="title">Turn a goal into something reviewable</title>
<desc id="desc">A hypothetical walking goal is annotated against five SMART questions: specific action, measurable minutes and days, achievable ability and time, relevant health priority, and a two-week review date. Numbers are an example, not a prescription.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="770" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="40" y="56" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Turn a goal into something reviewable</text>
<path d="M 40 82 L 920 82" fill="none" stroke="#6e6e73" stroke-width="3"/>
<rect x="40" y="122" width="880" height="133" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/><text x="64" y="157" font-size="23" font-weight="600" fill="#6e6e73" text-anchor="start">HYPOTHETICAL PROCESS GOAL</text><text x="64" y="199" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">For two weeks, walk after lunch for 10 minutes on three days</text>
<text x="64" y="234" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">each week, if this fits current ability and available time.</text><circle cx="75" cy="308" r="24" fill="#ffffff" stroke="#054a6b" stroke-width="3"/><text x="75" y="317" font-size="25" font-weight="600" fill="#054a6b" text-anchor="middle">S</text><text x="122" y="316" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="start">Specific</text><text x="336" y="316" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Walk after lunch.</text><path d="M 122 342 L 920 342" fill="none" stroke="#6e6e73" stroke-width="3"/><circle cx="75" cy="397" r="24" fill="#ffffff" stroke="#054a6b" stroke-width="3"/><text x="75" y="406" font-size="25" font-weight="600" fill="#054a6b" text-anchor="middle">M</text><text x="122" y="405" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="start">Measurable</text><text x="336" y="405" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Record minutes and days completed.</text><path d="M 122 431 L 920 431" fill="none" stroke="#6e6e73" stroke-width="3"/><circle cx="75" cy="486" r="24" fill="#ffffff" stroke="#0a5c22" stroke-width="3"/><text x="75" y="495" font-size="25" font-weight="600" fill="#0a5c22" text-anchor="middle">A</text><text x="122" y="494" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="start">Achievable</text><text x="336" y="494" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Check ability, route and available time.</text><path d="M 122 520 L 920 520" fill="none" stroke="#6e6e73" stroke-width="3"/><circle cx="75" cy="575" r="24" fill="#ffffff" stroke="#0a5c22" stroke-width="3"/><text x="75" y="584" font-size="25" font-weight="600" fill="#0a5c22" text-anchor="middle">R</text><text x="122" y="583" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="start">Relevant</text><text x="336" y="583" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Connect the walk to a personal health priority.</text><path d="M 122 609 L 920 609" fill="none" stroke="#6e6e73" stroke-width="3"/><circle cx="75" cy="664" r="24" fill="#ffffff" stroke="#054a6b" stroke-width="3"/><text x="75" y="673" font-size="25" font-weight="600" fill="#054a6b" text-anchor="middle">T</text><text x="122" y="672" font-size="26" font-weight="600" fill="#1d1d1f" text-anchor="start">Time-bound</text><text x="336" y="672" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Review the plan after two weeks.</text>
<path d="M 40 713 L 920 713" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="747" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual diagram • not measured data</text>
</g>
</svg>
