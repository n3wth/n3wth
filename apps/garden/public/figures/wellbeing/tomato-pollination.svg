<title id="title">Self-fertile still needs pollen transfer</title>
<desc id="desc">Simplified section of a tomato flower: anthers surround the stigma above the ovary. Vibration moves pollen to the stigma; fertilization then occurs through pollen-tube growth.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="650" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="40" y="56" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Self-fertile still needs pollen transfer</text>
<path d="M 40 82 L 920 82" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="122" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">One flower contains both pollen and ovules</text><path d="M130 350 C60 230 150 190 232 292 C220 145 360 150 315 298 C430 213 472 309 350 369 C433 445 310 510 277 405 C222 521 110 469 181 390Z" fill="#e8e8ed" stroke="#6e6e73" stroke-width="2"/><path d="M210 260 L238 390 L264 397 L252 260Z" fill="#b8860b" stroke="#6b5803" stroke-width="2"/><path d="M280 260 L292 397 L319 390 L322 260Z" fill="#b8860b" stroke="#6b5803" stroke-width="2"/><circle cx="279" cy="445" r="42" fill="#ffffff" stroke="#248a3d" stroke-width="3"/><path d="M 279 404 L 279 301" fill="none" stroke="#248a3d" stroke-width="3"/><circle cx="279" cy="299" r="10" fill="#248a3d" stroke="#248a3d" stroke-width="3"/><circle cx="266" cy="337" r="5" fill="#6b5803" stroke="#6b5803" stroke-width="3"/><circle cx="255" cy="318" r="5" fill="#6b5803" stroke="#6b5803" stroke-width="3"/><circle cx="272" cy="358" r="5" fill="#6b5803" stroke="#6b5803" stroke-width="3"/><path d="M 322 270 L 475 223" fill="none" stroke="#6e6e73" stroke-width="3"/><text x="495" y="222" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Anthers</text><text x="495" y="258" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Release pollen inside the cone.</text><path d="M 291 299 L 475 325" fill="none" stroke="#6e6e73" stroke-width="3"/><text x="495" y="327" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Stigma</text><text x="495" y="365" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Receives pollen when vibration</text>
<text x="495" y="399" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">shakes it loose.</text><path d="M 322 445 L 475 452" fill="none" stroke="#6e6e73" stroke-width="3"/><text x="495" y="456" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Ovary</text><text x="495" y="494" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Contains ovules; fertilization</text>
<text x="495" y="528" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">can lead to fruit and seeds.</text><text x="105" y="552" font-size="24" font-weight="400" fill="#6e6e73" text-anchor="start">Simplified flower cutaway</text>
<path d="M 40 593 L 920 593" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="627" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual diagram • not measured data</text>
