<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="765" viewBox="0 0 960 765" role="img" aria-labelledby="title desc">
<title id="title">Sequence the planting work</title>
<desc id="desc">Two preparations run in parallel: acclimating seedlings and preparing supports and irrigation. They converge at transplanting, followed by observation and watering adjustments.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="765" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="40" y="56" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Sequence the planting work</text>
<path d="M 40 82 L 920 82" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="62" y="175" font-size="28" font-weight="600" fill="#054a6b" text-anchor="start">Prepare seedlings</text><text x="62" y="217" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Acclimate gradually to</text>
<text x="62" y="252" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">outdoor light and conditions.</text><text x="552" y="175" font-size="28" font-weight="600" fill="#054a6b" text-anchor="start">Prepare the site</text><text x="552" y="217" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Plan supports and irrigation</text>
<text x="552" y="252" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">before roots occupy the bed.</text><path d="M 235 275 L 400 342" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><path d="M 725 275 L 560 342" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="405" font-size="28" font-weight="600" fill="#0a5c22" text-anchor="middle">Transplant when conditions fit</text><path d="M 480 438 L 480 492" fill="none" stroke="#6e6e73" stroke-width="3" marker-end="url(#arrow)"/><text x="157" y="545" font-size="28" font-weight="600" fill="#054a6b" text-anchor="start">Maintain by observation</text><text x="157" y="587" font-size="25" font-weight="400" fill="#1d1d1f" text-anchor="start">Check soil moisture and plant condition; adjust watering.</text><text x="40" y="684" font-size="24" font-weight="400" fill="#1d1d1f" text-anchor="start">Supports go in at planting; care continues after the setup tasks.</text>
<path d="M 40 708 L 920 708" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="742" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual diagram • not measured data</text>
</g>
</svg>
