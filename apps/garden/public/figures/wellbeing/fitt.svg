<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" role="img" aria-labelledby="title desc">
<title id="title">Four questions define a workout</title>
<desc id="desc">Four aligned rows map Frequency to how often and sessions per week, Intensity to effort or resistance, Time to session duration, and Type to the chosen activity. The rows describe separate planning dimensions.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="730" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="40" y="56" font-size="34" font-weight="600" fill="#1d1d1f" text-anchor="start">Four questions define a workout</text>
<path d="M 40 82 L 920 82" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="128" font-size="27" font-weight="400" fill="#1d1d1f" text-anchor="start">Describe the workout before changing it</text><circle cx="90" cy="192" r="34" fill="#ffffff" stroke="#6e6e73" stroke-width="3"/><text x="90" y="202" font-size="32" font-weight="600" fill="#1d1d1f" text-anchor="middle">F</text><text x="155" y="181" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Frequency</text><text x="155" y="223" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">How often?</text><text x="548" y="204" font-size="25" font-weight="400" fill="#054a6b" text-anchor="start">Days or sessions per week</text><path d="M 40 265 L 920 265" fill="none" stroke="#6e6e73" stroke-width="3"/><circle cx="90" cy="329" r="34" fill="#ffffff" stroke="#6e6e73" stroke-width="3"/><text x="90" y="339" font-size="32" font-weight="600" fill="#1d1d1f" text-anchor="middle">I</text><text x="155" y="318" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Intensity</text><text x="155" y="360" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">How hard?</text><text x="548" y="341" font-size="25" font-weight="400" fill="#054a6b" text-anchor="start">Effort or resistance</text><path d="M 40 402 L 920 402" fill="none" stroke="#6e6e73" stroke-width="3"/><circle cx="90" cy="466" r="34" fill="#ffffff" stroke="#6e6e73" stroke-width="3"/><text x="90" y="476" font-size="32" font-weight="600" fill="#1d1d1f" text-anchor="middle">T</text><text x="155" y="455" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Time</text><text x="155" y="497" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">How long?</text><text x="548" y="478" font-size="25" font-weight="400" fill="#054a6b" text-anchor="start">Session duration</text><path d="M 40 539 L 920 539" fill="none" stroke="#6e6e73" stroke-width="3"/><circle cx="90" cy="603" r="34" fill="#ffffff" stroke="#6e6e73" stroke-width="3"/><text x="90" y="613" font-size="32" font-weight="600" fill="#1d1d1f" text-anchor="middle">T</text><text x="155" y="592" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="start">Type</text><text x="155" y="634" font-size="26" font-weight="400" fill="#1d1d1f" text-anchor="start">Which activity?</text><text x="548" y="615" font-size="25" font-weight="400" fill="#054a6b" text-anchor="start">Walking, cycling, resistance…</text>
<path d="M 40 673 L 920 673" fill="none" stroke="#6e6e73" stroke-width="3"/>
<text x="40" y="707" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="start">Conceptual diagram • not measured data</text>
</g>
</svg>
