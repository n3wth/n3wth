<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="title desc">
<title id="title">Share the plan, keep ownership clear</title>
<desc id="desc">A two-role diagram shows the employee preparing career goals, current evidence and development activities, while a supervisor connects the goal to team needs, resources and practice opportunities. The inputs form a shared plan with a review date, followed by joint evaluation of its usefulness.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="800" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Share the plan, keep ownership clear</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><line x1="40" y1="360" x2="470" y2="360" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="185" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Employee prepares</text><text x="62" y="226" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Name the career goal.</text>
<text x="62" y="260" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Show current skill evidence.</text>
<text x="62" y="294" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Propose work that will</text>
<text x="62" y="328" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">develop the capability.</text><line x1="490" y1="360" x2="920" y2="360" stroke="#e8e8ed" stroke-width="2"/><text x="512" y="185" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Supervisor contributes</text><text x="512" y="226" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Connect to team needs.</text>
<text x="512" y="260" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Agree resources and access.</text>
<text x="512" y="294" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Help create a suitable</text>
<text x="512" y="328" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">practice opportunity.</text><path d="M 255 360 V 387 H 480 V 412" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 705 360 V 387 H 480" fill="none" stroke="#6e6e73" stroke-width="2.5"/><line x1="100" y1="601" x2="860" y2="601" stroke="#e8e8ed" stroke-width="2"/><text x="125" y="460" font-size="29" fill="#054a6b" font-weight="600" text-anchor="start">One shared development plan</text><text x="125" y="505" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">Goal  +  activity  +  support  +  review date</text>
<text x="125" y="539" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">Record what was completed and what it changed.</text><line x1="165" y1="703" x2="795" y2="703" stroke="#e8e8ed" stroke-width="2"/><text x="480" y="677" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="middle">Review usefulness together; revise the next step.</text><path d="M 480 601 V 628" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="771" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
