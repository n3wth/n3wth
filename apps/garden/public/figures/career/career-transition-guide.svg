<title id="title">Use evidence to pace a transition</title>
<desc id="desc">Four planning phases—assess, investigate, develop, and execute—are paired with readiness questions about strengths and constraints, role conversations and trials, relevant work, and fit. The sequence is conceptual and can be revisited; it supplies no fixed transition duration.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="800" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Use evidence to pace a transition</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><text x="55" y="154" font-size="22" fill="#6e6e73" font-weight="600" text-anchor="start">PLANNING PHASE</text><text x="365" y="154" font-size="22" fill="#6e6e73" font-weight="600" text-anchor="start">EVIDENCE BEFORE THE NEXT STEP</text><line x1="40" y1="283" x2="920" y2="283" stroke="#e8e8ed" stroke-width="2"/><text x="70" y="222" font-size="29" fill="#054a6b" font-weight="600" text-anchor="start">Assess</text><text x="365" y="218" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">Can I name my strengths</text>
<text x="365" y="252" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">and non-negotiables?</text><line x1="40" y1="407" x2="920" y2="407" stroke="#e8e8ed" stroke-width="2"/><text x="70" y="346" font-size="29" fill="#054a6b" font-weight="600" text-anchor="start">Investigate</text><text x="365" y="342" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">Have I tested the role through</text>
<text x="365" y="376" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">conversations and small trials?</text><line x1="40" y1="531" x2="920" y2="531" stroke="#e8e8ed" stroke-width="2"/><text x="70" y="470" font-size="29" fill="#054a6b" font-weight="600" text-anchor="start">Develop</text><text x="365" y="466" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">Can I show relevant work</text>
<text x="365" y="500" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">and explain what I learned?</text><line x1="40" y1="655" x2="920" y2="655" stroke="#e8e8ed" stroke-width="2"/><text x="70" y="594" font-size="29" fill="#054a6b" font-weight="600" text-anchor="start">Execute</text><text x="365" y="590" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">Does the opportunity match</text>
<text x="365" y="624" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">my goals and constraints?</text><path d="M 300 231 V 603" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="45" y="717" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Revisit an earlier phase when evidence changes your view.</text><text x="40" y="771" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
