<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc">
<title id="title">Use three lenses, then test the fit</title>
<desc id="desc">Interests, skills, and work values converge on candidate career hypotheses. A reality check asks the reader to talk with people in the role, try a small task, and check local opportunities and constraints. The diagram warns that assessment results suggest possibilities rather than decide fit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="790" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Use three lenses, then test the fit</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><line x1="40" y1="329" x2="320" y2="329" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="185" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Interests</text><text x="62" y="226" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Which activities</text>
<text x="62" y="260" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">give you energy?</text><line x1="340" y1="329" x2="620" y2="329" stroke="#e8e8ed" stroke-width="2"/><text x="362" y="185" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Skills</text><text x="362" y="226" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">What can you</text>
<text x="362" y="260" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">demonstrate now?</text><line x1="640" y1="329" x2="920" y2="329" stroke="#e8e8ed" stroke-width="2"/><text x="662" y="185" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Work values</text><text x="662" y="226" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Which conditions</text>
<text x="662" y="260" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">matter to you?</text><path d="M 180 329 V 360 H 480 V 393" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 480 329 V 393" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 780 329 V 360 H 480" fill="none" stroke="#6e6e73" stroke-width="2.5"/><line x1="245" y1="498" x2="715" y2="498" stroke="#e8e8ed" stroke-width="2"/><text x="480" y="438" font-size="28" fill="#0a5c22" font-weight="600" text-anchor="middle">Generate career hypotheses</text><text x="480" y="474" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="middle">Compare roles; keep alternatives open.</text><path d="M 480 498 V 542" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="95" y1="672" x2="865" y2="672" stroke="#e8e8ed" stroke-width="2"/><text x="120" y="585" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Reality check</text><text x="120" y="623" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Talk to people doing the work; try a small task.</text>
<text x="120" y="657" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Check local opportunities and your constraints.</text><text x="45" y="719" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Assessment results suggest possibilities; they do not decide fit.</text><text x="40" y="761" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
