<title id="title">Close the loop on a request</title>
<desc id="desc">A two-person conversation diagram shows a sender requesting a revised brief by Thursday, the receiver repeating the request and deadline, and the sender confirming and clarifying that the updated budget belongs in it. Arrows show the message, repeat-back and confirmation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="760" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Close the loop on a request</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><text x="90" y="165" font-size="24" fill="#054a6b" font-weight="600" text-anchor="start">SENDER</text><text x="728" y="165" font-size="24" fill="#0a5c22" font-weight="600" text-anchor="start">RECEIVER</text><line x1="145" y1="192" x2="145" y2="606" stroke="#e8e8ed" stroke-width="2"/><line x1="790" y1="192" x2="790" y2="606" stroke="#e8e8ed" stroke-width="2"/><line x1="205" y1="300" x2="750" y2="300" stroke="#e8e8ed" stroke-width="2"/><text x="228" y="237" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">State the request</text><text x="228" y="276" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">“Send the revised brief by Thursday.”</text><path d="M 146 310 H 785" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="205" y1="445" x2="750" y2="445" stroke="#e8e8ed" stroke-width="2"/><text x="228" y="382" font-size="27" fill="#0a5c22" font-weight="600" text-anchor="start">Repeat the meaning</text><text x="228" y="421" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">“The revised brief, due Thursday?”</text><path d="M 789 456 H 150" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="205" y1="590" x2="750" y2="590" stroke="#e8e8ed" stroke-width="2"/><text x="228" y="527" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Confirm or correct</text><text x="228" y="566" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">“Yes. Include the updated budget.”</text><path d="M 146 601 H 785" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="45" y="669" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Acknowledgment alone does not show that the request was understood.</text><text x="40" y="731" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
