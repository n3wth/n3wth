<title id="title">Carry the skill across the change</title>
<desc id="desc">Three illustrative bridges map a past task to a transferable skill and a new work context: explaining a technical issue to clarifying a customer need through communication; coordinating a release to launching a service through planning; and investigating a defect to analyzing a process failure through problem decomposition.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="760" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Carry the skill across the change</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><text x="45" y="153" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">Translate the work you did into the work a new role needs.</text><text x="60" y="225" font-size="22" fill="#054a6b" font-weight="600" text-anchor="start">PAST TASK</text><text x="360" y="225" font-size="22" fill="#0a5c22" font-weight="600" text-anchor="start">TRANSFERABLE SKILL</text><text x="685" y="225" font-size="22" fill="#054a6b" font-weight="600" text-anchor="start">NEW CONTEXT</text><line x1="40" y1="359" x2="920" y2="359" stroke="#e8e8ed" stroke-width="2"/><text x="65" y="289" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">Explain a</text>
<text x="65" y="323" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">technical issue</text><text x="365" y="289" font-size="27" fill="#0a5c22" font-weight="600" text-anchor="start">Clear</text>
<text x="365" y="323" font-size="27" fill="#0a5c22" font-weight="600" text-anchor="start">communication</text><text x="690" y="289" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">Clarify a</text>
<text x="690" y="323" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">customer need</text><path d="M 277 302 H 330" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 602 302 H 660" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="40" y1="482" x2="920" y2="482" stroke="#e8e8ed" stroke-width="2"/><text x="65" y="412" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">Coordinate</text>
<text x="65" y="446" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">a release</text><text x="365" y="412" font-size="27" fill="#0a5c22" font-weight="600" text-anchor="start">Planning and</text>
<text x="365" y="446" font-size="27" fill="#0a5c22" font-weight="600" text-anchor="start">collaboration</text><text x="690" y="412" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">Coordinate a</text>
<text x="690" y="446" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">service launch</text><path d="M 277 425 H 330" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 602 425 H 660" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="40" y1="605" x2="920" y2="605" stroke="#e8e8ed" stroke-width="2"/><text x="65" y="535" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">Investigate</text>
<text x="65" y="569" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">a defect</text><text x="365" y="535" font-size="27" fill="#0a5c22" font-weight="600" text-anchor="start">Problem</text>
<text x="365" y="569" font-size="27" fill="#0a5c22" font-weight="600" text-anchor="start">decomposition</text><text x="690" y="535" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">Investigate a</text>
<text x="690" y="569" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">process failure</text><path d="M 277 548 H 330" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 602 548 H 660" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="45" y="665" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Keep the evidence. Add the new domain knowledge separately.</text><text x="40" y="731" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
