<svg xmlns="http://www.w3.org/2000/svg" width="960" height="850" viewBox="0 0 960 850" role="img" aria-labelledby="title desc">
<title id="title">Adjust the workstation to the task</title>
<desc id="desc">An original front-view workstation schematic shows a raised screen on a stand, a separate keyboard and a nearby mouse. Callouts identify screen top near eye level, display directly in front, keyboard just below elbow height, and mouse in line with the elbow. It is not a scale drawing or an individual ergonomic assessment.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="850" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Adjust the workstation to the task</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><text x="45" y="150" font-size="28" fill="#054a6b" font-weight="600" text-anchor="start">Separate screen height from typing height.</text><rect x="305" y="220" width="350" height="230" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><rect x="327" y="242" width="306" height="179" rx="0" fill="#e8e8ed" stroke="#e8e8ed" stroke-width="1.5"/><line x1="480" y1="450" x2="480" y2="518" stroke="#1d1d1f" stroke-width="2"/><line x1="413" y1="518" x2="547" y2="518" stroke="#1d1d1f" stroke-width="2"/><line x1="240" y1="552" x2="755" y2="552" stroke="#1d1d1f" stroke-width="2"/><line x1="265" y1="552" x2="265" y2="671" stroke="#1d1d1f" stroke-width="2"/><line x1="727" y1="552" x2="727" y2="671" stroke="#1d1d1f" stroke-width="2"/><rect x="343" y="526" width="249" height="23" rx="0" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><ellipse cx="633" cy="533" rx="23" ry="15" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/><path d="M 240 230 H 280 L 305 230" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="45" y="198" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Screen top</text>
<text x="45" y="232" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">near eye level</text><path d="M 654 337 H 695 V 291 H 717" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="723" y="238" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Place screen</text>
<text x="723" y="272" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">directly</text>
<text x="723" y="306" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">in front</text><path d="M 342 537 H 224 V 462 H 199" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="45" y="395" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Keyboard</text>
<text x="45" y="429" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">just below</text>
<text x="45" y="463" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">elbow height</text><path d="M 653 533 H 770 V 478" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="715" y="399" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Mouse in line</text>
<text x="715" y="433" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">with your elbow</text><line x1="70" y1="765" x2="890" y2="765" stroke="#e8e8ed" stroke-width="2"/><text x="480" y="739" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="middle">For a laptop: raise the screen and use separate input devices.</text><text x="40" y="821" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
