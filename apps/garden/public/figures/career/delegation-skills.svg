<title id="title">Make the delegation agreement explicit</title>
<desc id="desc">A delegation agreement starts with the expected outcome, then covers four connected areas: the person's capability and workload, decision authority and escalation limits, necessary resources and support, and review with feedback. A note says that delegating ownership does not remove the leader's responsibility to support completion.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="790" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Make the delegation agreement explicit</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><line x1="220" y1="237" x2="740" y2="237" stroke="#e8e8ed" stroke-width="2"/><text x="480" y="183" font-size="29" fill="#1d1d1f" font-weight="600" text-anchor="middle">Agree on the outcome</text><text x="480" y="217" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="middle">What does acceptable completion look like?</text><line x1="40" y1="453" x2="470" y2="453" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="340" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Person and capacity</text><text x="62" y="381" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Match capability and workload.</text>
<text x="62" y="415" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Explain why this work matters.</text><line x1="490" y1="453" x2="920" y2="453" stroke="#e8e8ed" stroke-width="2"/><text x="512" y="340" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Authority and limits</text><text x="512" y="381" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Name decisions they can make.</text>
<text x="512" y="415" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Agree when to escalate.</text><line x1="40" y1="626" x2="470" y2="626" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="513" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Resources and support</text><text x="62" y="554" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Provide context and access.</text>
<text x="62" y="588" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Make help available.</text><line x1="490" y1="626" x2="920" y2="626" stroke="#e8e8ed" stroke-width="2"/><text x="512" y="513" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Review and feedback</text><text x="512" y="554" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Agree how to check progress.</text>
<text x="512" y="588" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Assess and recognize results.</text><text x="480" y="696" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="middle">Ownership moves; the leader still supports completion.</text><text x="40" y="761" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
