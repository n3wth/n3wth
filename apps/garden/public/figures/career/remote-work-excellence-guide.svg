<svg xmlns="http://www.w3.org/2000/svg" width="960" height="830" viewBox="0 0 960 830" role="img" aria-labelledby="title desc">
<title id="title">Choose a channel, preserve the outcome</title>
<desc id="desc">A conceptual decision tree asks whether a live exchange is needed to move work forward. If not, write with enough context and agree response expectations. If yes, convene with an agenda and room for discussion. Both paths end with a usable record of the decision, owner and next action.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="830" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Choose a channel, preserve the outcome</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><path d="M 480 140 L 735 260 L 480 380 L 225 260 Z" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/><text x="480" y="232" font-size="27" fill="#054a6b" font-weight="600" text-anchor="middle">Does this need</text>
<text x="480" y="266" font-size="27" fill="#054a6b" font-weight="600" text-anchor="middle">a live exchange</text>
<text x="480" y="300" font-size="27" fill="#054a6b" font-weight="600" text-anchor="middle">to move forward?</text><path d="M 225 260 H 175 V 418" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 735 260 H 785 V 418" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="125" y="331" font-size="23" fill="#0a5c22" font-weight="600" text-anchor="start">NO</text><text x="785" y="331" font-size="23" fill="#054a6b" font-weight="600" text-anchor="start">YES</text><line x1="40" y1="578" x2="460" y2="578" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="470" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Write with context</text><text x="62" y="511" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Name the question or update.</text>
<text x="62" y="545" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Agree response expectations.</text><line x1="500" y1="578" x2="920" y2="578" stroke="#e8e8ed" stroke-width="2"/><text x="522" y="470" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Convene with purpose</text><text x="522" y="511" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Share an agenda.</text>
<text x="522" y="545" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Make space for discussion.</text><path d="M 250 578 V 611 H 480 V 642" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 710 578 V 611 H 480" fill="none" stroke="#6e6e73" stroke-width="2.5"/><line x1="130" y1="740" x2="830" y2="740" stroke="#e8e8ed" stroke-width="2"/><text x="480" y="689" font-size="28" fill="#054a6b" font-weight="600" text-anchor="middle">Keep a usable record</text><text x="480" y="724" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="middle">Decision, owner, next action; make it easy to find.</text><text x="40" y="801" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
