<svg xmlns="http://www.w3.org/2000/svg" width="960" height="930" viewBox="0 0 960 930" role="img" aria-labelledby="title desc">
<title id="title">Match the response to the question</title>
<desc id="desc">A comparison matrix gives illustrative prompts for behavioral, technical, product design, case and system design interviews. It pairs them with the evidence to reveal: actions and outcomes, reasoning and correctness, user needs and priorities, assumptions and analysis, or requirements and trade-offs. Actual rounds may combine formats.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="930" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Match the response to the question</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><text x="45" y="152" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">Identify what the question asks you to make visible.</text><text x="62" y="217" font-size="22" fill="#054a6b" font-weight="600" text-anchor="start">FORMAT</text><text x="350" y="217" font-size="22" fill="#054a6b" font-weight="600" text-anchor="start">ILLUSTRATIVE PROMPT</text><text x="672" y="217" font-size="22" fill="#054a6b" font-weight="600" text-anchor="start">SHOW YOUR</text><line x1="40" y1="337" x2="920" y2="337" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="281" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">Behavioral</text><text x="350" y="278" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Tell me about a</text>
<text x="350" y="312" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">difficult handoff.</text><text x="672" y="278" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Own actions</text>
<text x="672" y="312" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">and outcomes</text><line x1="40" y1="445" x2="920" y2="445" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="389" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">Technical</text><text x="350" y="386" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Solve this problem</text>
<text x="350" y="420" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">and explain it.</text><text x="672" y="386" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Reasoning</text>
<text x="672" y="420" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">and correctness</text><line x1="40" y1="553" x2="920" y2="553" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="497" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">Product design</text><text x="350" y="494" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Improve an</text>
<text x="350" y="528" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">unfamiliar service.</text><text x="672" y="494" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">User needs</text>
<text x="672" y="528" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">and priorities</text><line x1="40" y1="661" x2="920" y2="661" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="605" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">Case</text><text x="350" y="602" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Why is this</text>
<text x="350" y="636" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">business struggling?</text><text x="672" y="602" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Assumptions</text>
<text x="672" y="636" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">and analysis</text><line x1="40" y1="769" x2="920" y2="769" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="713" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">System design</text><text x="350" y="710" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Design a service</text>
<text x="350" y="744" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">under constraints.</text><text x="672" y="710" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Requirements</text>
<text x="672" y="744" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">and trade-offs</text><text x="45" y="838" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">Interview rounds can mix formats. Confirm the format with the recruiter;</text>
<text x="45" y="872" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">use its demands to choose practice instead of memorizing one script.</text><text x="40" y="901" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
