<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="title desc">
<title id="title">Make the message answerable</title>
<desc id="desc">An illustrative project message is annotated with Situation, Background, Assessment and Request. A blocked launch handoff is the situation; a missing support runbook is the background; concern about gaps is explicitly the speaker's assessment; assigning an owner before launch is the request.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="800" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Make the message answerable</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><text x="45" y="153" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">A project handoff, framed for a decision</text><line x1="40" y1="286" x2="920" y2="286" stroke="#e8e8ed" stroke-width="2"/><circle cx="90" cy="235" r="29" fill="#054a6b"/><text x="90" y="245" font-size="29" fill="#ffffff" font-weight="600" text-anchor="middle">S</text><text x="145" y="224" font-size="25" fill="#054a6b" font-weight="600" text-anchor="start">Situation</text><text x="145" y="264" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">The launch handoff is blocked.</text><line x1="40" y1="404" x2="920" y2="404" stroke="#e8e8ed" stroke-width="2"/><circle cx="90" cy="353" r="29" fill="#0a5c22"/><text x="90" y="363" font-size="29" fill="#ffffff" font-weight="600" text-anchor="middle">B</text><text x="145" y="342" font-size="25" fill="#054a6b" font-weight="600" text-anchor="start">Background</text><text x="145" y="382" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">The support team has no runbook.</text><line x1="40" y1="522" x2="920" y2="522" stroke="#e8e8ed" stroke-width="2"/><circle cx="90" cy="471" r="29" fill="#6b5803"/><text x="90" y="481" font-size="29" fill="#ffffff" font-weight="600" text-anchor="middle">A</text><text x="145" y="460" font-size="25" fill="#054a6b" font-weight="600" text-anchor="start">Assessment</text><text x="145" y="500" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">I expect gaps in launch support.</text><line x1="40" y1="640" x2="920" y2="640" stroke="#e8e8ed" stroke-width="2"/><circle cx="90" cy="589" r="29" fill="#054a6b"/><text x="90" y="599" font-size="29" fill="#ffffff" font-weight="600" text-anchor="middle">R</text><text x="145" y="578" font-size="25" fill="#054a6b" font-weight="600" text-anchor="start">Request</text><text x="145" y="618" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">Can we assign an owner before launch?</text><text x="45" y="707" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Separate observed context, your interpretation, and the requested action.</text><text x="40" y="771" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
