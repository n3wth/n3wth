<svg xmlns="http://www.w3.org/2000/svg" width="960" height="750" viewBox="0 0 960 750" role="img" aria-labelledby="title desc">
<title id="title">Keep the roadmap open to new evidence</title>
<desc id="desc">A branching roadmap starts with a project or role-shadowing experiment, moves to a review of evidence, and opens three options: deepen expertise, broaden scope, or explore a pivot. A return path encourages another experiment. Later options are not probabilities or a required career ladder.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="750" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Keep the roadmap open to new evidence</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><text x="50" y="154" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">Plan the next experiment in detail; keep later choices open.</text><text x="80" y="220" font-size="23" fill="#054a6b" font-weight="600" text-anchor="start">NOW</text><text x="335" y="220" font-size="23" fill="#054a6b" font-weight="600" text-anchor="start">NEXT REVIEW</text><text x="705" y="220" font-size="22" fill="#054a6b" font-weight="600" text-anchor="start">POSSIBLE DIRECTIONS</text><path d="M 255 345 H 389" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 505 345 H 590 V 277 H 675" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 590 345 H 675" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 590 345 V 413 H 675" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="45" y1="410" x2="250" y2="410" stroke="#e8e8ed" stroke-width="2"/><text x="68" y="320" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">Try a project</text>
<text x="68" y="354" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">or shadow</text>
<text x="68" y="388" font-size="27" fill="#1d1d1f" font-weight="400" text-anchor="start">a role</text><circle cx="455" cy="345" r="61" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/><text x="455" y="338" font-size="24" fill="#1d1d1f" font-weight="600" text-anchor="middle">Review</text>
<text x="455" y="372" font-size="24" fill="#1d1d1f" font-weight="600" text-anchor="middle">evidence</text><line x1="690" y1="309" x2="920" y2="309" stroke="#e8e8ed" stroke-width="2"/><text x="710" y="286" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Deepen expertise</text><line x1="690" y1="378" x2="920" y2="378" stroke="#e8e8ed" stroke-width="2"/><text x="710" y="355" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Broaden scope</text><line x1="690" y1="447" x2="920" y2="447" stroke="#e8e8ed" stroke-width="2"/><text x="710" y="424" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Explore a pivot</text><line x1="70" y1="620" x2="890" y2="620" stroke="#e8e8ed" stroke-width="2"/><text x="95" y="540" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">At each review</text><text x="95" y="580" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">What did I learn about fit, ability, and constraints?</text>
<text x="95" y="614" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">What is the smallest useful next experiment?</text><path d="M 455 406 V 473 H 130 V 413" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="45" y="679" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Branches are options, not a ranking or a prediction.</text><text x="40" y="721" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
