<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc">
<title id="title">Make the skills gap testable</title>
<desc id="desc">An illustrative comparison matrix links current evidence, target capability, and the next test. It includes writing a decision memo, coordinating a cross-team handoff, and applying coursework to a real task. The final instruction is to schedule a review and record evidence of capability.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="790" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Make the skills gap testable</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><text x="50" y="150" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">A goal becomes actionable when the gap has a test.</text><line x1="40" y1="667" x2="920" y2="667" stroke="#e8e8ed" stroke-width="2"/><line x1="40" y1="246" x2="920" y2="246" stroke="#e8e8ed" stroke-width="2"/><text x="60" y="223" font-size="22" fill="#054a6b" font-weight="600" text-anchor="start">CURRENT EVIDENCE</text><text x="345" y="223" font-size="22" fill="#054a6b" font-weight="600" text-anchor="start">TARGET CAPABILITY</text><text x="635" y="223" font-size="22" fill="#054a6b" font-weight="600" text-anchor="start">NEXT TEST</text><line x1="325" y1="182" x2="325" y2="667" stroke="#e8e8ed" stroke-width="2"/><line x1="610" y1="182" x2="610" y2="667" stroke="#e8e8ed" stroke-width="2"/><text x="60" y="282" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Drafts need</text>
<text x="60" y="316" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">heavy revision</text><text x="345" y="282" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Write a clear</text>
<text x="345" y="316" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">decision memo</text><text x="635" y="282" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Draft one memo;</text>
<text x="635" y="316" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">ask a reviewer</text>
<text x="635" y="350" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">to identify the ask</text><line x1="40" y1="376" x2="920" y2="376" stroke="#e8e8ed" stroke-width="2"/><text x="60" y="417" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Delivers within</text>
<text x="60" y="451" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">one team</text><text x="345" y="417" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Coordinate work</text>
<text x="345" y="451" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">across teams</text><text x="635" y="417" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Own a small</text>
<text x="635" y="451" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">handoff with</text>
<text x="635" y="485" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">shared criteria</text><line x1="40" y1="511" x2="920" y2="511" stroke="#e8e8ed" stroke-width="2"/><text x="60" y="552" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Knows tools</text>
<text x="60" y="586" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">in coursework</text><text x="345" y="552" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Apply them to</text>
<text x="345" y="586" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">a real problem</text><text x="635" y="552" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Complete a task;</text>
<text x="635" y="586" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">review the work</text>
<text x="635" y="620" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">with a mentor</text><text x="45" y="715" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Set a review date and record the evidence, not just completion.</text><text x="40" y="761" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
