<svg xmlns="http://www.w3.org/2000/svg" width="960" height="750" viewBox="0 0 960 750" role="img" aria-labelledby="title desc">
<title id="title">Connect circles, not just contacts</title>
<desc id="desc">A conceptual network shows the reader in a familiar circle and an occasional contact bridging to another community. Solid lines connect people within each circle and a dashed line marks the bridge. Node placement and line lengths encode no data, and the note cautions that weaker ties are not always better.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="750" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Connect circles, not just contacts</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><text x="65" y="158" font-size="23" fill="#054a6b" font-weight="600" text-anchor="start">FAMILIAR CIRCLE</text><text x="662" y="158" font-size="23" fill="#054a6b" font-weight="600" text-anchor="start">ANOTHER COMMUNITY</text><line x1="150" y1="290" x2="290" y2="235" stroke="#6e6e73" stroke-width="2"/><line x1="150" y1="290" x2="280" y2="380" stroke="#6e6e73" stroke-width="2"/><line x1="290" y1="235" x2="280" y2="380" stroke="#6e6e73" stroke-width="2"/><line x1="150" y1="290" x2="115" y2="443" stroke="#6e6e73" stroke-width="2"/><line x1="115" y1="443" x2="280" y2="380" stroke="#6e6e73" stroke-width="2"/><line x1="715" y1="270" x2="830" y2="365" stroke="#6e6e73" stroke-width="2"/><line x1="715" y1="270" x2="660" y2="435" stroke="#6e6e73" stroke-width="2"/><line x1="830" y1="365" x2="660" y2="435" stroke="#6e6e73" stroke-width="2"/><path d="M 280 380 L 470 330 L 660 435" fill="none" stroke="#054a6b" stroke-width="2.5" stroke-dasharray="7 6"/><circle cx="150" cy="290" r="41" fill="#1d1d1f" stroke="#6e6e73" stroke-width="2"/><text x="150" y="299" font-size="26" fill="#ffffff" font-weight="600" text-anchor="middle">You</text><circle cx="290" cy="235" r="27" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/><circle cx="280" cy="380" r="27" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/><circle cx="115" cy="443" r="27" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/><circle cx="470" cy="330" r="27" fill="#054a6b" stroke="#6e6e73" stroke-width="2"/><circle cx="715" cy="270" r="27" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/><circle cx="830" cy="365" r="27" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/><circle cx="660" cy="435" r="27" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/><text x="470" y="215" font-size="25" fill="#054a6b" font-weight="400" text-anchor="middle">An occasional</text>
<text x="470" y="249" font-size="25" fill="#054a6b" font-weight="400" text-anchor="middle">contact can connect</text>
<text x="470" y="283" font-size="25" fill="#054a6b" font-weight="400" text-anchor="middle">different circles.</text><path d="M 470 292 V 302" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="45" y1="648" x2="915" y2="648" stroke="#e8e8ed" stroke-width="2"/><text x="70" y="559" font-size="27" fill="#0a5c22" font-weight="600" text-anchor="start">Reach beyond the same information pool</text><text x="70" y="598" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">A bridge may introduce information your close contacts do not have.</text>
<text x="70" y="632" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Maintain close relationships too; weaker is not always better.</text><text x="45" y="683" font-size="22" fill="#1d1d1f" font-weight="400" text-anchor="start">Dashed line = illustrative bridge. Node positions are not measured.</text><text x="40" y="721" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
