<title id="title">Anchor proficiency in evidence</title>
<desc id="desc">A skills assessment worksheet uses autonomy, complexity, influence and knowledge as dimensions. It asks for completed tasks and help needed, unfamiliar constraints, decisions involving others, and explanations of trade-offs. Review questions make the evidence observable. It does not map the article's five levels to SFIA levels.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="830" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Anchor proficiency in evidence</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><text x="45" y="151" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">Describe performance in context before assigning a level.</text><line x1="40" y1="674" x2="920" y2="674" stroke="#e8e8ed" stroke-width="2"/><line x1="40" y1="246" x2="920" y2="246" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="224" font-size="22" fill="#054a6b" font-weight="600" text-anchor="start">DIMENSION</text><text x="312" y="224" font-size="22" fill="#054a6b" font-weight="600" text-anchor="start">EVIDENCE TO COLLECT</text><text x="645" y="224" font-size="22" fill="#054a6b" font-weight="600" text-anchor="start">REVIEW QUESTION</text><text x="62" y="292" font-size="26" fill="#1d1d1f" font-weight="600" text-anchor="start">Autonomy</text><text x="312" y="284" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">A completed task and</text>
<text x="312" y="318" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">the help it required</text><text x="645" y="284" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">What can you do</text>
<text x="645" y="318" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">independently?</text><line x1="40" y1="348" x2="920" y2="348" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="395" font-size="26" fill="#1d1d1f" font-weight="600" text-anchor="start">Complexity</text><text x="312" y="387" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">A problem with</text>
<text x="312" y="421" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">unfamiliar constraints</text><text x="645" y="387" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Which complications</text>
<text x="645" y="421" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">can you handle?</text><line x1="40" y1="451" x2="920" y2="451" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="498" font-size="26" fill="#1d1d1f" font-weight="600" text-anchor="start">Influence</text><text x="312" y="490" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">A decision or handoff</text>
<text x="312" y="524" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">involving other people</text><text x="645" y="490" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Whose work can</text>
<text x="645" y="524" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">you help coordinate?</text><line x1="40" y1="554" x2="920" y2="554" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="601" font-size="26" fill="#1d1d1f" font-weight="600" text-anchor="start">Knowledge</text><text x="312" y="593" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">An explanation of</text>
<text x="312" y="627" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">choices and trade-offs</text><text x="645" y="593" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Can you explain</text>
<text x="645" y="627" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">why it works?</text><text x="45" y="718" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Record the task, context, reviewer, and next evidence needed.</text>
<text x="45" y="752" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">This worksheet does not convert the article’s levels to SFIA levels.</text><text x="40" y="801" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
