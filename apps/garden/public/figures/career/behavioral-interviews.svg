<title id="title">Structure the answer and the assessment</title>
<desc id="desc">Two complementary responsibilities converge on evidence of job-related capability. The candidate provides a relevant situation, task, action and result. The interviewer asks consistent job-related questions and applies common rating standards. The central questions ask what the person did and how it relates to the role.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="790" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Structure the answer and the assessment</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><line x1="40" y1="329" x2="450" y2="329" stroke="#e8e8ed" stroke-width="2"/><text x="62" y="186" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Candidate’s job</text><text x="62" y="227" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Choose a relevant experience.</text>
<text x="62" y="261" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Explain the situation and task.</text>
<text x="62" y="295" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Describe your actions and result.</text><line x1="510" y1="329" x2="920" y2="329" stroke="#e8e8ed" stroke-width="2"/><text x="532" y="186" font-size="27" fill="#054a6b" font-weight="600" text-anchor="start">Interviewer’s job</text><text x="532" y="227" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Use job-related questions.</text>
<text x="532" y="261" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Keep the question order consistent.</text>
<text x="532" y="295" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Apply the same rating standards.</text><path d="M 245 329 V 363 H 480 V 398" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 715 329 V 363 H 480" fill="none" stroke="#6e6e73" stroke-width="2.5"/><line x1="140" y1="567" x2="820" y2="567" stroke="#e8e8ed" stroke-width="2"/><text x="165" y="448" font-size="28" fill="#054a6b" font-weight="600" text-anchor="start">Shared focus: evidence of the capability</text><text x="165" y="491" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">What did this person actually do?</text>
<text x="165" y="525" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">How does that behavior relate to the role?</text><line x1="75" y1="696" x2="885" y2="696" stroke="#e8e8ed" stroke-width="2"/><text x="100" y="643" font-size="26" fill="#0a5c22" font-weight="600" text-anchor="start">Structure belongs on both sides of the conversation.</text><text x="100" y="679" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">A polished story is useful only when it supplies relevant evidence.</text><text x="40" y="761" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
