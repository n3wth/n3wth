<title id="title">Diagnose the work of leadership</title>
<desc id="desc">Three diagnostic rows connect team outcomes to example observations and responses. Direction addresses disagreement on priorities; alignment addresses overlap and failed handoffs; commitment addresses local wins taking priority over the collective goal. The reader is asked to gather the group's evidence rather than rely only on a leader's impression.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="790" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Diagnose the work of leadership</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><text x="45" y="154" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Look for a team outcome before choosing a leadership behavior.</text><line x1="40" y1="333" x2="920" y2="333" stroke="#e8e8ed" stroke-width="2"/><text x="65" y="230" font-size="31" fill="#054a6b" font-weight="600" text-anchor="start">Direction</text><text x="335" y="226" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">People disagree on the priority.</text><text x="335" y="273" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Ask the team to name a shared outcome.</text><text x="65" y="275" font-size="23" fill="#6e6e73" font-weight="400" text-anchor="start">Where to look</text><line x1="40" y1="501" x2="920" y2="501" stroke="#e8e8ed" stroke-width="2"/><text x="65" y="398" font-size="31" fill="#0a5c22" font-weight="600" text-anchor="start">Alignment</text><text x="335" y="394" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Work overlaps or handoffs fail.</text><text x="335" y="441" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Clarify responsibilities and dependencies.</text><text x="65" y="443" font-size="23" fill="#6e6e73" font-weight="400" text-anchor="start">What to coordinate</text><line x1="40" y1="669" x2="920" y2="669" stroke="#e8e8ed" stroke-width="2"/><text x="65" y="566" font-size="31" fill="#6b5803" font-weight="600" text-anchor="start">Commitment</text><text x="335" y="562" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">Local wins displace the team goal.</text><text x="335" y="609" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Discuss shared responsibility and obstacles.</text><text x="65" y="611" font-size="23" fill="#6e6e73" font-weight="400" text-anchor="start">What to sustain</text><text x="45" y="729" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Ask the group for evidence; a leader’s impression is only one view.</text><text x="40" y="761" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
