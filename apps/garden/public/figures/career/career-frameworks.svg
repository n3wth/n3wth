<svg xmlns="http://www.w3.org/2000/svg" width="960" height="830" viewBox="0 0 960 830" role="img" aria-labelledby="title desc">
<title id="title">Match the framework to the decision</title>
<desc id="desc">A framework chooser pairs four questions with tools: career fit with interests, skills and values; development priorities with an individual development plan; learning methods with experience, people and study; and progress with an evidence review. It makes no numerical allocation of learning time.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="830" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Match the framework to the decision</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><text x="50" y="154" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">Choose a framework for the question in front of you.</text><line x1="40" y1="304" x2="920" y2="304" stroke="#e8e8ed" stroke-width="2"/><text x="65" y="224" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">What work fits me?</text><text x="420" y="224" font-size="25" fill="#054a6b" font-weight="600" text-anchor="start">Interests, skills, values</text><text x="420" y="266" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">Generate options to investigate.</text><path d="M 350 242 H 393" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="40" y1="441" x2="920" y2="441" stroke="#e8e8ed" stroke-width="2"/><text x="65" y="361" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">What should I develop?</text><text x="420" y="361" font-size="25" fill="#054a6b" font-weight="600" text-anchor="start">Individual development plan</text><text x="420" y="403" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">Link a goal to activities and review.</text><path d="M 350 379 H 393" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="40" y1="578" x2="920" y2="578" stroke="#e8e8ed" stroke-width="2"/><text x="65" y="498" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">How should I learn?</text><text x="420" y="498" font-size="25" fill="#054a6b" font-weight="600" text-anchor="start">Experience + people + study</text><text x="420" y="540" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">Combine practice with support.</text><path d="M 350 516 H 393" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="40" y1="715" x2="920" y2="715" stroke="#e8e8ed" stroke-width="2"/><text x="65" y="635" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">What shows progress?</text><text x="420" y="635" font-size="25" fill="#054a6b" font-weight="600" text-anchor="start">Evidence review</text><text x="420" y="677" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">Compare work with role requirements.</text><path d="M 350 653 H 393" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="45" y="752" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">These tools answer different questions; no stage model sets your pace.</text><text x="40" y="801" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
