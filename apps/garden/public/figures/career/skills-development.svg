<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc">
<title id="title">Practice retrieval across sessions</title>
<desc id="desc">A conceptual timeline shows initial study followed by recall and checking, a later session beginning with retrieval before rereading, and another return to retrieve or use the concept and check errors. An error log guides subsequent practice. Spacing is schematic and does not represent an optimal interval or measured gain.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="790" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Practice retrieval across sessions</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><text x="45" y="152" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">For concepts you need to remember and use</text><path d="M 80 251 H 880" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="120" cy="251" r="12" fill="#054a6b"/><circle cx="460" cy="251" r="12" fill="#054a6b"/><circle cx="800" cy="251" r="12" fill="#054a6b"/><text x="120" y="211" font-size="22" fill="#054a6b" font-weight="600" text-anchor="middle">FIRST SESSION</text><text x="460" y="211" font-size="22" fill="#054a6b" font-weight="600" text-anchor="middle">LATER SESSION</text><text x="800" y="211" font-size="22" fill="#054a6b" font-weight="600" text-anchor="middle">RETURN AGAIN</text><text x="105" y="306" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Study a concept.</text>
<text x="105" y="349" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Close the source.</text>
<text x="105" y="392" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Recall it.</text>
<text x="105" y="435" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Check the answer.</text><text x="395" y="306" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Retrieve again</text>
<text x="395" y="349" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">before rereading.</text>
<text x="395" y="392" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Compare with</text>
<text x="395" y="435" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">a reliable answer.</text><text x="700" y="306" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Try another</text>
<text x="700" y="349" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">question or use.</text>
<text x="700" y="392" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Check errors.</text>
<text x="700" y="435" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Plan more practice.</text><line x1="65" y1="651" x2="895" y2="651" stroke="#e8e8ed" stroke-width="2"/><text x="90" y="570" font-size="28" fill="#054a6b" font-weight="600" text-anchor="start">Keep a small error log</text><text x="90" y="611" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">What was missing? What will you retrieve or practice next?</text><text x="45" y="705" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">Spacing shown conceptually; no interval or improvement is estimated.</text><text x="40" y="761" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
