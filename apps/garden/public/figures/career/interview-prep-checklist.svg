<svg xmlns="http://www.w3.org/2000/svg" width="960" height="780" viewBox="0 0 960 780" role="img" aria-labelledby="title desc">
<title id="title">Check the output of preparation</title>
<desc id="desc">An evidence checklist pairs role research with identified capabilities and open questions, behavioral preparation with a specific action-and-outcome story, mock practice with feedback and a revised answer, and logistics with confirmed arrangements and tested equipment. It does not prescribe a number of preparation hours.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/></marker></defs>
<rect width="960" height="780" fill="#f5f5f7"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
<text x="40" y="58" font-size="34" fill="#1d1d1f" font-weight="600" text-anchor="start">Check the output of preparation</text><text x="40" y="97" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">CAREER / RESEARCH FIGURE</text><text x="45" y="153" font-size="26" fill="#1d1d1f" font-weight="400" text-anchor="start">Replace “time spent” with a visible result of practice.</text><line x1="40" y1="658" x2="920" y2="658" stroke="#e8e8ed" stroke-width="2"/><line x1="40" y1="246" x2="920" y2="246" stroke="#e8e8ed" stroke-width="2"/><text x="64" y="225" font-size="22" fill="#054a6b" font-weight="600" text-anchor="start">PREPARATION TASK</text><text x="450" y="225" font-size="22" fill="#054a6b" font-weight="600" text-anchor="start">EVIDENCE IT IS READY</text><text x="65" y="288" font-size="26" fill="#1d1d1f" font-weight="600" text-anchor="start">Research the role</text><text x="450" y="281" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">A short list of required capabilities</text>
<text x="450" y="315" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">and questions you still need answered.</text><line x1="40" y1="349" x2="920" y2="349" stroke="#e8e8ed" stroke-width="2"/><text x="65" y="390" font-size="26" fill="#1d1d1f" font-weight="600" text-anchor="start">Prepare behavioral stories</text><text x="450" y="383" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">An example with your action</text>
<text x="450" y="417" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">and an honest, specific outcome.</text><line x1="40" y1="451" x2="920" y2="451" stroke="#e8e8ed" stroke-width="2"/><text x="65" y="492" font-size="26" fill="#1d1d1f" font-weight="600" text-anchor="start">Run a mock interview</text><text x="450" y="485" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Feedback on clarity and relevance;</text>
<text x="450" y="519" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">a revised answer practiced aloud.</text><line x1="40" y1="553" x2="920" y2="553" stroke="#e8e8ed" stroke-width="2"/><text x="65" y="594" font-size="26" fill="#1d1d1f" font-weight="600" text-anchor="start">Check the format and setup</text><text x="450" y="587" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Confirmed arrangements and</text>
<text x="450" y="621" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">working materials or equipment.</text><text x="45" y="706" font-size="25" fill="#1d1d1f" font-weight="400" text-anchor="start">After a mock: choose one gap, revise, and test that answer again.</text><text x="40" y="751" font-size="22" fill="#6e6e73" font-weight="400" text-anchor="start">Conceptual guide. Examples are illustrative.</text></g>
</svg>
