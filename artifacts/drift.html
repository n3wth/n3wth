html, body { height: 100%; }
html { overflow-x: clip; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Geist Sans', ui-sans-serif, system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  overflow-x: clip;
}

.stage {
  position: fixed;
  inset: 0;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: crosshair;
}

/* Corner ticks — blueprint registration marks */
.tick {
  position: fixed;
  width: 14px; height: 14px;
  pointer-events: none;
  border-color: var(--border-strong);
  border-style: solid;
  border-width: 0;
}
.tick.tl { top: 12px; left: 12px; border-top-width: 1px; border-left-width: 1px; }
.tick.tr { top: 12px; right: 12px; border-top-width: 1px; border-right-width: 1px; }
.tick.bl { bottom: 12px; left: 12px; border-bottom-width: 1px; border-left-width: 1px; }
.tick.br { bottom: 12px; right: 12px; border-bottom-width: 1px; border-right-width: 1px; }

header {
  position: fixed;
  top: 24px; left: 28px;
  pointer-events: none;
  max-width: min(360px, calc(100vw - 56px));
}
h1 {
  font-family: 'Satoshi', 'Geist Sans', sans-serif;
  font-weight: 600;
  font-size: 28px;
  line-height: 1.1;
  margin: 0 0 6px;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.sub {
  color: var(--ink-dim);
  font-size: 13px;
  margin: 0;
  max-width: 34ch;
}
.readout {
  font-family: 'Geist Mono', ui-monospace, monospace;
  font-size: 11px;
  color: var(--ink-dim);
  margin-top: 10px;
  display: flex;
  gap: 16px;
  font-variant-numeric: tabular-nums;
}
.readout span b {
  font-weight: 400;
  color: var(--ink);
}

.panel {
  position: fixed;
  left: 28px;
  bottom: 28px;
  width: min(300px, calc(100vw - 56px));
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  padding: 16px 18px 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid var(--border);
  padding-bottom: 10px;
}
.panel-head .label { margin: 0; }
.label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 10px;
}
.row .label { grid-column: 1 / -1; margin-bottom: -6px; }
.val {
  font-family: 'Geist Mono', ui-monospace, monospace;
  font-size: 11px;
  color: var(--ink-dim);
  min-width: 5ch;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 24px;
  background: transparent;
  margin: 0;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 1px;
  background: var(--border-strong);
}
input[type="range"]::-moz-range-track {
  height: 1px;
  background: var(--border-strong);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 11px; height: 11px;
  margin-top: -5px;
  background: var(--bg);
  border: 1px solid var(--ink);
  border-radius: 0;
}
input[type="range"]::-moz-range-thumb {
  width: 11px; height: 11px;
  background: var(--bg);
  border: 1px solid var(--ink);
  border-radius: 0;
}
input[type="range"]:focus-visible {
  outline: 1px solid var(--ink);
  outline-offset: 2px;
}

.tints {
  display: flex;
  gap: 8px;
  align-items: center;
}
.tint {
  width: 22px; height: 22px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  cursor: pointer;
  padding: 0;
  position: relative;
}
.tint::after {
  content: '';
  position: absolute;
  inset: 5px;
  background: var(--swatch);
}
.tint[aria-pressed="true"] {
  border-color: var(--ink);
  outline: 1px solid var(--ink);
  outline-offset: -3px;
}
.tint:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.actions {
  display: flex;
  gap: 8px;
  border-top: 1px solid var(--border);
  padding-top: 14px;
}
button.act {
  flex: 1;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  min-height: 44px;
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--border-strong);
  cursor: pointer;
  padding: 0 12px;
  white-space: nowrap;
}
button.act:hover { border-color: var(--ink); }
button.act:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

.hint {
  position: fixed;
  right: 28px;
  bottom: 28px;
  font-family: 'Geist Mono', ui-monospace, monospace;
  font-size: 11px;
  color: var(--ink-faint);
  pointer-events: none;
  text-align: right;
}

.static-note {
  display: none;
}

@media (max-width: 640px) {
  header { top: 20px; left: 20px; }
  h1 { font-size: 22px; }
  .panel { left: 12px; right: 12px; bottom: 12px; width: auto; }
  .hint { display: none; }
  .tick { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .static-note {
    display: block;
    position: fixed;
    right: 28px;
    top: 28px;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 11px;
    color: var(--ink-dim);
    border: 1px solid var(--border);
    padding: 6px 10px;
    background: var(--surface);
  }
  .hint { display: none; }
}
</style>

<div class="stage"><canvas id="c" aria-label="Flow field particle canvas"></canvas></div>
<i class="tick tl"></i><i class="tick tr"></i><i class="tick bl"></i><i class="tick br"></i>

<header>
  <h1>Drift</h1>
  <p class="sub">A flow field study. Particles follow a seeded noise field. Drag on the canvas to bend it.</p>
  <div class="readout">
    <span>seed <b id="seedOut">—</b></span>
    <span>fps <b id="fpsOut">—</b></span>
  </div>
</header>

<div class="static-note">reduced motion on — showing the field as a still plot</div>

<section class="panel" aria-label="Field controls">
  <div class="panel-head">
    <p class="label">Field</p>
    <p class="label" id="stateOut" style="letter-spacing:0.04em">running</p>
  </div>

  <div class="row">
    <span class="label" id="l-count">Particles</span>
    <input type="range" id="count" min="500" max="6000" step="100" value="3000" aria-labelledby="l-count">
    <span class="val" id="countVal">3000</span>
  </div>
  <div class="row">
    <span class="label" id="l-speed">Speed</span>
    <input type="range" id="speed" min="10" max="300" step="5" value="110" aria-labelledby="l-speed">
    <span class="val" id="speedVal">1.1</span>
  </div>
  <div class="row">
    <span class="label" id="l-scale">Field scale</span>
    <input type="range" id="scale" min="1" max="20" step="1" value="6" aria-labelledby="l-scale">
    <span class="val" id="scaleVal">6</span>
  </div>
  <div class="row">
    <span class="label" id="l-fade">Trail</span>
    <input type="range" id="fade" min="1" max="30" step="1" value="8" aria-labelledby="l-fade">
    <span class="val" id="fadeVal">8</span>
  </div>

  <div class="row">
    <span class="label">Ink</span>
    <div class="tints" role="group" aria-label="Particle tint" style="grid-column: 1 / -1">
      <button class="tint" data-tint="mono"  style="--swatch: var(--tint-mono)"  aria-pressed="true"  aria-label="Monochrome"></button>
      <button class="tint" data-tint="cyan"  style="--swatch: var(--tint-cyan)"  aria-pressed="false" aria-label="Cyan"></button>
      <button class="tint" data-tint="green" style="--swatch: var(--tint-green)" aria-pressed="false" aria-label="Green"></button>
      <button class="tint" data-tint="amber" style="--swatch: var(--tint-amber)" aria-pressed="false" aria-label="Amber"></button>
      <button class="tint" data-tint="red"   style="--swatch: var(--tint-red)"   aria-pressed="false" aria-label="Red"></button>
    </div>
  </div>

  <div class="actions">
    <button class="act" id="pauseBtn">Pause</button>
    <button class="act" id="reseedBtn">Reseed</button>
    <button class="act" id="exportBtn" hidden>PNG</button>
  </div>
</section>

<p class="hint">drag to disturb the field</p>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');

  // ---- seeded PRNG (mulberry32) + value noise -------------------------
  function mulberry32(a) {
    return () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  const GRID = 64;
  let lattice = new Float32Array(GRID * GRID);
  let seed = 0;

  function reseed(newSeed) {
    seed = newSeed >>> 0;
    const rand = mulberry32(seed);
    for (let i = 0; i < lattice.length; i++) lattice[i] = rand();
    document.getElementById('seedOut').textContent =
      seed.toString(16).padStart(8, '0');
  }

  function smooth(t) { return t * t * (3 - 2 * t); }

  // value noise in [0,1); x,y in lattice units, wraps at GRID
  function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const x0 = xi & (GRID - 1), x1 = (xi + 1) & (GRID - 1);
    const y0 = yi & (GRID - 1), y1 = (yi + 1) & (GRID - 1);
    const a = lattice[y0 * GRID + x0], b = lattice[y0 * GRID + x1];
    const c = lattice[y1 * GRID + x0], d = lattice[y1 * GRID + x1];
    const u = smooth(xf), v = smooth(yf);
    return a + (b - a) * u + (c + (d - c) * u - (a + (b - a) * u)) * v;
  }

  // ---- theme-reactive colors ------------------------------------------
  const TINTS = ['mono', 'cyan', 'green', 'amber', 'red'];
  let tint = 'mono';
  let inkColor = '#f2f3f5';
  let bgColor = '#08090b';

  function readTokens() {
    const cs = getComputedStyle(document.documentElement);
    bgColor = cs.getPropertyValue('--canvas-bg').trim();
    inkColor = cs.getPropertyValue('--tint-' + tint).trim();
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTokens(); if (reduced.matches) drawStatic(); });
  new MutationObserver(() => { readTokens(); if (reduced.matches) drawStatic(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ---- particles ------------------------------------------------------
  const P = { count: 3000, speed: 1.1, scale: 6, fade: 8 };
  let px = new Float32Array(0), py = new Float32Array(0), age = new Float32Array(0);
  let spawnRand = mulberry32(1);

  function allocate(n) {
    const nx = new Float32Array(n), ny = new Float32Array(n), na = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      if (i < px.length) { nx[i] = px[i]; ny[i] = py[i]; na[i] = age[i]; }
      else {
        nx[i] = spawnRand() * canvas.width;
        ny[i] = spawnRand() * canvas.height;
        na[i] = spawnRand() * 200;
      }
    }
    px = nx; py = ny; age = na;
  }

  // pointer disturbance
  const pointer = { x: 0, y: 0, strength: 0 };

  function fieldAngle(x, y, w, h) {
    const s = P.scale / Math.max(w, h);
    let a = noise(x * s * GRID * 0.25, y * s * GRID * 0.25) * Math.PI * 4;
    if (pointer.strength > 0.01) {
      const dx = x - pointer.x, dy = y - pointer.y;
      const d2 = dx * dx + dy * dy;
      const r = 160;
      if (d2 < r * r) {
        const f = (1 - Math.sqrt(d2) / r) * pointer.strength;
        a += Math.atan2(dy, dx) * f + f * 2.4;
      }
    }
    return a;
  }

  function step(dt) {
    const w = canvas.width, h = canvas.height;
    const v = P.speed * dt * 60 * dpr;
    for (let i = 0; i < P.count; i++) {
      const a = fieldAngle(px[i], py[i], w, h);
      px[i] += Math.cos(a) * v;
      py[i] += Math.sin(a) * v;
      age[i] -= 1;
      if (px[i] < 0 || px[i] >= w || py[i] < 0 || py[i] >= h || age[i] <= 0) {
        px[i] = spawnRand() * w;
        py[i] = spawnRand() * h;
        age[i] = 100 + spawnRand() * 300;
      }
    }
  }

  function draw() {
    ctx.globalAlpha = P.fade / 100;
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = inkColor;
    const s = Math.max(1, dpr);
    for (let i = 0; i < P.count; i++) ctx.fillRect(px[i], py[i], s, s);
    ctx.globalAlpha = 1;
  }

  // static plot for reduced motion: short field-line strokes on a grid
  function drawStatic() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = inkColor;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = dpr;
    const gap = 26 * dpr, len = 9 * dpr;
    ctx.beginPath();
    for (let y = gap / 2; y < h; y += gap) {
      for (let x = gap / 2; x < w; x += gap) {
        const a = fieldAngle(x, y, w, h);
        ctx.moveTo(x - Math.cos(a) * len, y - Math.sin(a) * len);
        ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
      }
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---- sizing ---------------------------------------------------------
  let dpr = Math.min(devicePixelRatio || 1, 2);
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.floor(canvas.clientWidth * dpr);
    canvas.height = Math.floor(canvas.clientHeight * dpr);
    readTokens();
    if (reduced.matches) drawStatic();
  }
  addEventListener('resize', resize);

  // ---- main loop ------------------------------------------------------
  let paused = false;
  let last = 0, frames = 0, fpsClock = 0;
  const fpsOut = document.getElementById('fpsOut');

  function frame(t) {
    requestAnimationFrame(frame);
    if (paused || reduced.matches) return;
    const dt = Math.min((t - last) / 1000, 0.05) || 0.016;
    last = t;
    frames++; fpsClock += dt;
    if (fpsClock >= 0.5) {
      fpsOut.textContent = Math.round(frames / fpsClock);
      frames = 0; fpsClock = 0;
    }
    pointer.strength *= 0.94;
    step(dt);
    draw();
  }

  // ---- controls -------------------------------------------------------
  const $ = id => document.getElementById(id);

  $('count').addEventListener('input', e => {
    P.count = +e.target.value;
    $('countVal').textContent = P.count;
    allocate(P.count);
  });
  $('speed').addEventListener('input', e => {
    P.speed = +e.target.value / 100;
    $('speedVal').textContent = P.speed.toFixed(1);
  });
  $('scale').addEventListener('input', e => {
    P.scale = +e.target.value;
    $('scaleVal').textContent = P.scale;
    if (reduced.matches) drawStatic();
  });
  $('fade').addEventListener('input', e => {
    P.fade = +e.target.value;
    $('fadeVal').textContent = P.fade;
  });

  document.querySelectorAll('.tint').forEach(btn => {
    btn.addEventListener('click', () => {
      tint = btn.dataset.tint;
      document.querySelectorAll('.tint').forEach(b =>
        b.setAttribute('aria-pressed', String(b === btn)));
      const cs = getComputedStyle(document.documentElement);
      inkColor = cs.getPropertyValue('--tint-' + tint).trim();
      if (reduced.matches) drawStatic();
    });
  });

  $('pauseBtn').addEventListener('click', () => {
    paused = !paused;
    $('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
    $('stateOut').textContent = paused ? 'paused' : 'running';
  });

  $('reseedBtn').addEventListener('click', () => {
    reseed((seed * 1664525 + 1013904223) >>> 0);
    if (reduced.matches) drawStatic();
    else { ctx.fillStyle = bgColor; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  });

  // ---- export (artifact `downloads` capability) -----------------------
  const exportBtn = $('exportBtn');
  if (window.claude && window.claude.downloads) {
    exportBtn.hidden = false;
    exportBtn.addEventListener('click', () => {
      canvas.toBlob(blob => {
        if (!blob) return;
        window.claude.downloads
          .save({ filename: 'drift-' + seed.toString(16).padStart(8, '0') + '.png', data: blob })
          .then(() => { exportBtn.textContent = 'Saved'; })
          .catch(err => {
            if (err && (err.code === 'declined' || err.code === 'rate_limited')) return;
            exportBtn.hidden = true; // unusable in this view
          })
          .finally(() => setTimeout(() => { exportBtn.textContent = 'PNG'; }, 1500));
      }, 'image/png');
    });
  }

  // ---- pointer --------------------------------------------------------
  canvas.addEventListener('pointerdown', e => {
    pointer.x = e.offsetX * dpr; pointer.y = e.offsetY * dpr;
    pointer.strength = 1;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (e.buttons) {
      pointer.x = e.offsetX * dpr; pointer.y = e.offsetY * dpr;
      pointer.strength = 1;
      if (reduced.matches) drawStatic();
    }
  });
  canvas.addEventListener('pointerup', () => { /* strength decays in frame() */ });

  reduced.addEventListener('change', () => {
    if (reduced.matches) drawStatic();
    else { readTokens(); }
  });

  // ---- boot -----------------------------------------------------------
  // fixed boot seed keeps first paint reproducible; Reseed rolls from it
  reseed(0x6e337468); // "n3wth"
  resize();
  allocate(P.count);
  if (reduced.matches) { drawStatic(); fpsOut.textContent = '0'; }
  requestAnimationFrame(frame);
})();
</script>
